</style></head><body><div class="app"><aside class="side" id="sidebar"><div><nav class="nav" id="nav"></nav></div><div class="sidefoot"><strong id="userLabel">Шеф</strong><span id="userSub">Управление сетью</span></div></aside><main class="main"><div class="top"><button class="mobilemenu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<a href="#" class="top-brand" onclick="event.preventDefault();navigate('overview')" title="На главную"><span class="mark">+</span> Medpoint</a>
<div class="topright"><span class="top-user" id="topUserName">Шеф</span><div class="avatar" id="topAvatar">Ш</div><button class="btn small" id="logoutBtn">Выйти</button></div></div><div class="content" id="content"></div></main></div><div class="backdrop" id="backdrop"><div class="drawer"><header><h2 id="drawerTitle"></h2><button id="close">×</button></header><div id="drawerBody"></div></div></div><div class="backdrop" id="historyModal"><div class="drawer" style="width:min(720px,100%)"><header><h2>История изменений</h2><button onclick="document.getElementById('historyModal').classList.remove('open')">×</button></header><div id="historyModalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=v=>v?new Date(v).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}):'—';
const API='/api/v1';
const S={user:null,agents:[],admins:[],clinics:[],specs:[]};
let page='overview',query='',agentFilter='all',agentId=null,adminId=null,clinicId=null;

const NAME={overview:'Обзор',pending:'Заявки',admins:'Администраторы',agents:'Агенты',clinics:'Клиники',reports:'Отчёты'};
const SL={pending:'Ожидает',active:'Активен',inactive:'Отключён',rejected:'Отклонён'};
const SP={pending:'new',active:'approved',inactive:'rejected',rejected:'rejected'};
const NAV=['overview','pending','admins','agents','clinics','reports'];

async function api(p,o={}){
  const r=await fetch(API+p,{credentials:'include',...o});
  if(r.status===401){location.href='/';throw new Error('401')}
  if(r.status===403)throw new Error('Нет доступа');
  const t=await r.text();let d=null;
  if(t){try{d=JSON.parse(t)}catch{d=t}}
  if(!r.ok){
    let msg = 'HTTP '+r.status;
    if(d && d.detail){
      if(Array.isArray(d.detail)){
        const FIELD_RU = {
          password: 'Пароль', email: 'Email', full_name: 'ФИО', phone: 'Телефон',
          name: 'Название', city: 'Город', address: 'Адрес',
          default_rate: 'Ставка', custom_rate: 'Личная ставка', mode: 'Режим',
          clinic_ids: 'Клиники', specialization_ids: 'Специализации',
          decision_reason: 'Причина', active: 'Статус', permissions: 'Права',
        };
        const MSG_RU = [
          { re: /String should have at least (\d+) characters/i, fn: m => `минимум ${m[1]} символов` },
          { re: /String should have at most (\d+) characters/i, fn: m => `максимум ${m[1]} символов` },
          { re: /field required/i, fn: () => 'обязательное поле' },
          { re: /value is not a valid email address/i, fn: () => 'некорректный email' },
          { re: /Input should be a valid integer/i, fn: () => 'должно быть числом' },
          { re: /Input should be a valid number/i, fn: () => 'должно быть числом' },
          { re: /Input should be greater than or equal to (\d+)/i, fn: m => `не меньше ${m[1]}` },
          { re: /Input should be less than or equal to (\d+)/i, fn: m => `не больше ${m[1]}` },
          { re: /String should match pattern/i, fn: () => 'неверный формат' },
          { re: /Input should be a valid boolean/i, fn: () => 'должно быть true/false' },
          { re: /Input should be a valid list/i, fn: () => 'должен быть список' },
        ];
        const parts = d.detail.map(e => {
          const key = Array.isArray(e.loc) ? e.loc.filter(x => x !== 'body' && x !== 'query' && x !== 'path').pop() : '';
          const fieldRu = FIELD_RU[key] || key || 'Поле';
          let msgRu = e.msg || 'ошибка';
          for(const m of MSG_RU){
            const match = msgRu.match(m.re);
            if(match){ msgRu = m.fn(match); break; }
          }
          return `${fieldRu}: ${msgRu}`;
        });
        msg = parts.join('; ');
      } else if(typeof d.detail === 'string'){
        msg = d.detail;
      } else {
        msg = 'Ошибка валидации';
      }
    } else if(d && d.error){
      msg = d.error;
    }
    throw new Error(msg);
  }
  return d;
}
function validateForm(form){
  const errors = [];
  form.querySelectorAll('input, select, textarea').forEach(el=>{
    if(el.disabled || el.type==='hidden') return;
    const v = (el.value||'').trim();
    const label = el.dataset.label || el.getAttribute('aria-label') || el.name || 'Поле';
    if(el.required && !v){ errors.push(`${label}: обязательно для заполнения`); return; }
    if(!v) return;
    if(el.type==='email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){
      errors.push(`${label}: некорректный email`);
    }
    if(el.type==='password' && el.minLength && v.length < el.minLength){
      errors.push(`${label}: минимум ${el.minLength} символов`);
    }
    if(el.type==='tel'){
      const digits = v.replace(/\D/g,'');
      if(digits.length < 10 || digits.length > 15){
        errors.push(`${label}: некорректный номер телефона`);
      }
    }
    if(el.type==='number'){
      const n = Number(v);
      if(el.min!=='' && n < Number(el.min)) errors.push(`${label}: не меньше ${el.min}`);
      if(el.max!=='' && n > Number(el.max)) errors.push(`${label}: не больше ${el.max}`);
    }
  });
  return errors;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),4000);}
function openDrawer(title,body){$('#drawerTitle').textContent=title;$('#drawerBody').innerHTML=body;$('#backdrop').classList.add('open');document.body.style.overflow='hidden';}
function closeDrawer(){$('#backdrop').classList.remove('open');document.body.style.overflow='';}

const cName=id=>S.clinics.find(c=>c.id===Number(id))?.name||'—';
const aName=id=>S.admins.find(a=>a.id===Number(id))?.full_name||'—';
const sName=id=>S.specs.find(s=>s.id===Number(id))?.name||('#'+id);
const heading=(t,d,act='')=>`<div class="heading"><div><h1>${esc(t)}</h1>${d?`<p class="muted">${esc(d)}</p>`:''}</div>${act}</div>`;
const table=(h,rows)=>`<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${h.length}" class="empty">Ничего не найдено</td></tr>`}</tbody></table></div>`;
const pill=(l,t='')=>`<span class="pill ${t}">${esc(l)}</span>`;

async function loadAll(){
  try{
    const [a,ad,c,s]=await Promise.all([api('/agents'),api('/admins'),api('/clinics'),api('/specializations')]);
    S.agents=a||[];S.admins=ad||[];S.clinics=c||[];S.specs=s||[];
  }catch(e){
    console.error('loadAll error:', e);
    toast('Ошибка загрузки: '+e.message);
  }
  try{
    const hist = await api('/history?limit=5');
    window.__historyCache = hist;
  }catch(e){ window.__historyCache = []; }
}
function navigate(p){page=p;agentId=null;adminId=null;clinicId=null;query='';location.hash=p;render();scrollTo(0,0);}
function render(){
  nav();
  const m={overview,requests,admins,agents,clinics,reports};
  const html = (m[page]||overview)();
  const cont = document.querySelector('#content');
  if(cont) cont.innerHTML = html;
  if(page==='overview' && window.__historyCache){
    const el = document.getElementById('historyList');
    if(el){
      el.innerHTML = window.__historyCache.length
        ? window.__historyCache.map(h => `<div class="change-item"><div class="change-item-body"><strong>${esc(h.label)}</strong><small>${esc(h.text)}</small></div><div class="change-item-time">${dt(h.created_at)}</div></div>`).join('')
        : '<div class="empty">История пуста</div>';
    }
  }
}
function nav(){
  const pc=S.agents.filter(a=>a.status==='pending').length;
  $('#nav').innerHTML=NAV.map(t=>`<button class="${page===t?'active':''}" data-page="${t}">${NAME[t]}${t==='pending'&&pc?`<span class="nav-count">${pc}</span>`:''}</button>`).join('');
  const u=S.user||{};
  $('#userLabel').textContent=u.full_name||'Шеф';$('#topUserName').textContent=u.full_name||'Шеф';
  $('#topAvatar').textContent=(u.full_name||'Ш').split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase();
  $('#sidebar').classList.remove('open');
}

function overview(){
  const pend=S.agents.filter(a=>a.status==='pending'),act=S.agents.filter(a=>a.status==='active');

function multiSelectHtml(wrapId,dropId,items,initial){
  return `<div class="multi-select" id="${wrapId}"><span class="muted" style="font-size:13px">Выберите...</span><div class="multi-select-dropdown" id="${dropId}"></div></div>`;
}
function setupMultiSelect(wrapId,dropId,items,initial,onChange){
  const wrap=document.getElementById(wrapId),drop=document.getElementById(dropId);
  if(!wrap||!drop)return;
  const sel=new Set(initial||[]);
  function render(){
    wrap.querySelectorAll('.multi-select-tag').forEach(t=>t.remove());
    const m=wrap.querySelector('span.muted');if(m)m.remove();
    if(!sel.size)wrap.insertAdjacentHTML('afterbegin','<span class="muted" style="font-size:13px">Выберите...</span>');
    [...sel].forEach(id=>{const it=items.find(x=>Number(x.id)===Number(id));wrap.insertAdjacentHTML('afterbegin',`<span class="multi-select-tag" data-id="${id}">${esc(it?.name||('#'+id))}<span class="x" data-remove="${id}">×</span></span>`);});
    drop.innerHTML=items.map(it=>`<div class="multi-select-option ${sel.has(Number(it.id))?'selected':''}" data-add="${it.id}">${esc(it.name)}</div>`).join('');
  }
  render();
  wrap.addEventListener('click',e=>{const rm=e.target.closest('[data-remove]');if(rm){sel.delete(Number(rm.dataset.remove));render();onChange([...sel]);e.stopPropagation();return;}if(!e.target.closest('.multi-select-option'))drop.classList.toggle('show');});
  drop.addEventListener('click',e=>{const o=e.target.closest('[data-add]');if(!o)return;const id=Number(o.dataset.add);if(sel.has(id))sel.delete(id);else sel.add(id);render();onChange([...sel]);drop.classList.add('show');e.stopPropagation();});
  document.addEventListener('click',e=>{if(!wrap.contains(e.target))drop.classList.remove('show');});
}

      <div class="field"><label>Статус</label><select name="active">${['true','false'].map(v=>`<option value="${v}" ${String(active)===v?'selected':''}>${v==='true'?'Активна':'Отключена'}</option>`).join('')}</select></div>
      <div class="actions"><button class="btn primary" type="submit">Сохранить</button><button class="btn" type="button" onclick="closeDrawer()">Отмена</button></div>
    </form>`);
}

// ===== Обработчики =====
document.addEventListener('click',async e=>{
  const pg=e.target.closest('[data-page]');if(pg){navigate(pg.dataset.page);return;}
  const a=e.target.closest('[data-action]');if(!a)return;
  const id=Number(a.dataset.id);
  try{
    switch(a.dataset.action){
      case 'viewAgent':agentId=id;page='agents';render();scrollTo(0,0);break;
      case 'viewAdmin':adminId=id;page='admins';render();scrollTo(0,0);break;
      case 'clinicSettings':clinicId=id;page='clinics';render();scrollTo(0,0);
        document.getElementById('clinicSpecsBlock').innerHTML=await clinicSpecsHtml(id);break;
      case 'approve':openApprove(id);break;
      case 'reject':openReject(id);break;
      case 'editAgent':openEditAgent(id);break;
      case 'delAgent':
        if(!confirm('Удалить агента?'))return;
        await api(`/agents/${id}`,{method:'DELETE'});toast('Удалён');await loadAll();navigate('agents');break;
      case 'editAdmin':openAdminForm(id);break;
      case 'newAdmin':openAdminForm();break;
      case 'delAdmin':
        if(!confirm('Удалить администратора?'))return;
        await api(`/admins/${id}`,{method:'DELETE'});toast('Удалён');await loadAll();navigate('admins');break;
      case 'newClinic':openClinicForm();break;
      case 'editClinic':openClinicForm(id);break;
      case 'editSpec':openEditSpec(a.dataset.clinic,a.dataset.spec,a.dataset.rate,a.dataset.active);break;
      case 'viewAllHistory':
        document.getElementById('historyModal').classList.add('open');
        document.getElementById('historyModalBody').innerHTML = `
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
            <button class="btn small" data-hist-filter="all">Все</button>
            <button class="btn small" data-hist-filter="chef">Мои</button>
            <button class="btn small" data-hist-filter="admin">Администраторы</button>
            <button class="btn small" data-hist-filter="agent">Агенты</button>
          </div>
          <div id="historyFilteredList"><div class="empty">Загрузка...</div></div>`;
        loadHistoryModal('all');
        break;
    }
  }catch(err){toast('Ошибка: '+err.message);}
});

document.addEventListener('change',e=>{
  if(e.target.id==='agentStatusFilter'){agentFilter=e.target.value;render();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='search'){
    const inp = e.target;
    const selStart = inp.selectionStart;
    const selEnd = inp.selectionEnd;
    query = inp.value;
    render();
    requestAnimationFrame(()=>{
      const newInp = document.querySelector('#search');
      if(newInp){
        newInp.focus();
        try { newInp.setSelectionRange(selStart, selEnd); } catch(_){}
      }
    });
  }
});

document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,fd=new FormData(f);
  const errs = validateForm(f);
  if(errs.length){ toast(errs[0]); return; }
  try{
    if(f.id==='approveForm'){
      const id=Number(f.dataset.id);
      if(!selClinicIds.length)throw new Error('Выберите хотя бы одну клинику');
      await api(`/agents/${id}/approve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clinic_ids:selClinicIds,specialization_ids:selSpecIds,admin_id:fd.get('admin_id')?Number(fd.get('admin_id')):null})});
      toast('Агент одобрен');closeDrawer();await loadAll();render();
    }
    if(f.id==='rejectForm'){
      const id=Number(f.dataset.id);
      const reason=String(fd.get('decision_reason')||'').trim();
      if(!reason)throw new Error('Укажите причину');
      await api(`/agents/${id}/reject`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision_reason:reason})});
      toast('Агент отклонён');closeDrawer();await loadAll();render();
    }
    if(f.id==='editAgentForm'){
      const id=Number(f.dataset.id);
      await api(`/agents/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:fd.get('full_name'),phone:fd.get('phone')||null,status:fd.get('status'),clinic_ids:selClinicIds,specialization_ids:selSpecIds,admin_id:fd.get('admin_id')?Number(fd.get('admin_id')):null})});
      toast('Агент обновлён');closeDrawer();await loadAll();render();
    }
    if(f.id==='adminForm'){
      const id=f.dataset.id?Number(f.dataset.id):null;
      const permissions={reviewRegistrations:!!fd.get('reviewRegistrations')};
      if(id){
        await api(`/admins/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:fd.get('full_name'),phone:fd.get('phone')||null,active:fd.get('active')==='true',permissions,clinic_ids:selAdminClinicIds})});
        toast('Обновлён');
      }else{
        await api(`/admins`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:fd.get('email'),password:fd.get('password'),full_name:fd.get('full_name'),phone:fd.get('phone')||null,permissions,clinic_ids:selAdminClinicIds})});
        toast('Создан');
      }
      closeDrawer();await loadAll();render();
    }
    if(f.id==='clinicForm'){
      const id=f.dataset.id?Number(f.dataset.id):null;
      const body={name:fd.get('name'),city:fd.get('city'),address:fd.get('address')||null,phone:fd.get('phone')||null,active:fd.get('active')==='true'};
      if(id)await api(`/clinics/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      else await api(`/clinics`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      toast(id?'Обновлена':'Создана');closeDrawer();clinicId=null;await loadAll();render();
    }
    if(f.id==='specForm'){
      const cid=Number(f.dataset.clinic),sid=Number(f.dataset.spec);
      const r=String(fd.get('default_rate')||'').trim();
      await api(`/clinics/${cid}/specialties/${sid}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({default_rate:r===''?null:Number(r),active:fd.get('active')==='true'})});
      toast('Сохранено');closeDrawer();
      document.getElementById('clinicSpecsBlock').innerHTML=await clinicSpecsHtml(cid);
    }
  }catch(err){toast('Ошибка: '+err.message);}
});

$('#close').onclick=closeDrawer;
$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeDrawer();});
$('#historyModal').addEventListener('click',e=>{if(e.target.id==='historyModal')document.getElementById('historyModal').classList.remove('open');});
$('#logoutBtn').onclick=async()=>{try{await api('/auth/logout',{method:'POST'});}catch{}location.href='/';};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();document.getElementById('historyModal').classList.remove('open');$('#sidebar').classList.remove('open');}});

async function loadHistoryModal(filter){
  const el = document.getElementById('historyFilteredList');
  if(!el) return;
  try{
    const url = filter==='all' ? '/history?limit=200' : `/history?limit=200&actor_type=${filter}`;
    const items = await api(url);
    el.innerHTML = items.length
      ? items.map(h => `<div class="change-item"><div class="change-item-body"><strong>${esc(h.label)}</strong><small>${esc(h.text)}</small><small style="color:#8da1a4;margin-top:2px">${esc(h.actor_type)}${h.actor_name?': '+esc(h.actor_name):''}</small></div><div class="change-item-time">${dt(h.created_at)}</div></div>`).join('')
      : '<div class="empty">Нет записей</div>';
  }catch(e){ el.innerHTML = `<div class="empty">Ошибка: ${esc(e.message)}</div>`; }
}

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-hist-filter]');
  if(b){ loadHistoryModal(b.dataset.histFilter); }
});

(async function init(){
  try{
    S.user=await api('/auth/me');
    if(!S.user||S.user.role!=='chef'){location.href='/';return;}
    await loadAll();
    const h=location.hash.replace('#','')||'overview';
    page=Object.keys(NAME).includes(h)?h:'overview';
    render();
  }catch(e){location.href='/';}
})();
</script></body></html>
