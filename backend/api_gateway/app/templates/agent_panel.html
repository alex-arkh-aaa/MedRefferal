<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedReferral · Кабинет агента</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%232563eb'/%3E%3Cpath d='M32 15v34M15 32h34' stroke='%23fff' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/static/agent_panel.css">
</head>
<body>
<div class="app">
  <aside class="side" id="sidebar">
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <strong id="userLabel">Загрузка…</strong>
      <span id="userSub"></span>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <button class="mobilemenu" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Открыть меню">
        <i class="fas fa-bars"></i>
      </button>
      <a href="/agent_panel#dashboard" class="top-brand" title="На главную">
        <span class="mark"><i class="fas fa-hospital-alt"></i></span>
        <span>MedReferral</span>
      </a>
      <div class="topright">
        <span class="top-user" id="topUserName">—</span>
        <div class="avatar" id="topAvatar">—</div>
        <button class="btn small" id="logoutBtn" type="button">
          <i class="fas fa-sign-out-alt"></i> Выйти
        </button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="backdrop" id="backdrop">
  <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <header>
      <h2 id="drawerTitle"></h2>
      <button id="close" aria-label="Закрыть">×</button>
    </header>
    <div id="drawerBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/static/agent_panel.js"></script>
</body>
</html>
