<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Диагноз поставлен</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 50px 45px;
            max-width: 580px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(37, 99, 235, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 300px;
            height: 300px;
            background: rgba(37, 99, 235, 0.04);
            border-radius: 50%;
        }

        .badge {
            display: inline-block;
            background: #fee2e2;
            color: #dc2626;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .icon {
            font-size: 4.5rem;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 4.5rem;
            font-weight: 800;
            color: #1e293b;
            line-height: 1;
        }

        .subtitle {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2563eb;
            margin: 5px 0 20px;
        }

        .card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px 25px;
            margin: 20px 0 30px;
            text-align: left;
            border: 1px solid #e2e8f0;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .card-row:last-child {
            border-bottom: none;
        }

        .card-label {
            color: #64748b;
            font-weight: 500;
        }

        .card-value {
            color: #1e293b;
            font-weight: 600;
        }

        .card-value.error {
            color: #dc2626;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.3);
        }

        .btn-outline {
            background: #f1f5f9;
            color: #1e293b;
        }

        .btn-outline:hover {
            background: #e2e8f0;
            transform: translateY(-3px);
        }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 3.2rem; }
            .subtitle { font-size: 1.1rem; }
            .icon { font-size: 3.2rem; }
            .card { padding: 15px 18px; font-size: 0.95rem; }
            .buttons { flex-direction: column; align-items: center; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">🩺 Диагноз поставлен</div>

        <div class="icon">📄</div>
        <h1>404</h1>
        <div class="subtitle">Страница не найдена</div>

        <div class="card">
            <div class="card-row">
                <span class="card-label">Пациент</span>
                <span class="card-value">Ваш браузер</span>
            </div>
            <div class="card-row">
                <span class="card-label">Жалобы</span>
                <span class="card-value">Страница не открывается</span>
            </div>
            <div class="card-row">
                <span class="card-label">Диагноз</span>
                <span class="card-value error">❌ Синдром отсутствующей страницы (404)</span>
            </div>
            <div class="card-row">
                <span class="card-label">Назначение</span>
                <span class="card-value">🔙 Вернуться на главную</span>
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-outline" onclick="history.back()">
                <i class="fas fa-arrow-left"></i> Назад
            </button>
            <a href="\dashboard" class="btn btn-primary">
                <i class="fas fa-home"></i> На главную
            </a>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</body>
</html>
