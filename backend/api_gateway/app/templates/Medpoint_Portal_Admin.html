function isoDate(value){if(/^\d{4}-\d{2}-\d{2}$/.test(value||''))return value;const numeric=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(value||'');if(numeric)return `${numeric[3]}-${numeric[2]}-${numeric[1]}`;const months=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];const text=/^(\d{1,2})\s+([а-я]+)\s+(\d{4})$/i.exec(value||'');if(text){const m=months.findIndex(x=>text[2].startsWith(x));if(m>=0)return `${text[3]}-${String(m+1).padStart(2,'0')}-${text[1].padStart(2,'0')}`}return ''}
function migrateData(raw){
  const d=structuredClone(raw);

    agent.clinicIds ||= agent.clinicId?[agent.clinicId]:[];

      const old=agent.rates[id];

    if(r.status==='work')r.status='new';
    if(!('clinicId' in r)&&r.doctorId){const a=d.doctors.find(x=>x.id===r.doctorId);r.clinicId=a?.clinicIds?.[0]||null}

      if(r.status==='approved'){
        const agent=d.doctors.find(x=>x.id===r.doctorId);
        const rateEntry=agent?.rates?.[r.specializationId];
        if(rateEntry?.mode==='custom'&&rateEntry.customRate!==null){
          r.commissionRate=rateEntry.customRate;
        }else{
          const cid=r.clinicId??(agent?.clinicIds?.[0]||null);
          const spec=d.clinics.find(c=>c.id===cid)?.specialties?.find(s=>s.id===r.specializationId);
          r.commissionRate=spec?.active?spec.defaultRate??null:null;
        }
      }else{
        r.commissionRate=null;
      }
    }
  }  
  d.adminHistory ||= [];d.registrations ??= structuredClone(seed.registrations||[]);
  for(const admin of d.admins){
    admin.permissions ||= {};admin.permissions.reviewRegistrations ??= false;
    if(!('clinicIds' in admin))admin.clinicIds=admin.clinicId?[admin.clinicId]:[];
    delete admin.clinicId;
  }

}

function decideRegistration(id,decision,assignedAdminId,reason){
  const r=visibleRegistrations().find(x=>x.id===Number(id));if(!r)throw Error('Заявка на регистрацию недоступна.');

  if(decision==='rejected'&&!note)throw Error('Укажите причину отклонения.');
  let newAgent=null;

    const adminId=Number(assignedAdminId),admin=adminById(adminId);

}

function saveAdminAccount(id,values){

  if(clinicIds.some(cid=>!clinicById(cid)))throw Error('Выбрана несуществующая клиника.');

}

function reports(){return heading('Отчёты','Выплаты агентам и аналитика по заявкам')+`<section class="panel"><div class="panelhead"><div><h2>Параметры отчётов</h2><p>Период по дате заявки, обе границы включены</p></div><div class="preset-buttons"><button class="btn small" data-action="reportPreset" data-preset="month">Этот месяц</button><button class="btn small" data-action="reportPreset" data-preset="previous">Прошлый месяц</button><button class="btn small" data-action="reportPreset" data-preset="all">Весь период</button></div></div><div class="report-fields"><div class="field"><label>Начало периода</label><input type="date" data-report-field="from" value="${esc(reportFilters.from)}"></div><div class="field"><label>Конец периода</label><input type="date" data-report-field="to" value="${esc(reportFilters.to)}"></div><div class="field"><label>Специализация услуги</label><select data-report-field="specialty"><option value="all">Все специализации</option>${options(availableFilterSpecialties(),reportFilters.specialty)}<option value="missing" ${reportFilters.specialty==='missing'?'selected':''}>Не указана</option></select></div><div class="field"><label>Агент</label><select data-report-field="agent"><option value="all">Все агенты</option>${options(visibleAgents(),reportFilters.agent)}</select></div></div></section><div id="reportResults">${reportResults()}</div>`}

function payrollTable(rows){return table(['Код агента','ФИО агента','Период','Вознаграждение к выплате'],rows.map(x=>`<tr><td>AG-${x.agentId}</td><td>${esc(agentById(x.agentId)?.name||'—')}</td><td>${reportFilters.from} — ${reportFilters.to}</td><td><strong>${money(x.amount)}</strong></td></tr>`))}

function setReportPreset(preset){const [year,month]=localToday.split('-').map(Number),iso=d=>d.toISOString().slice(0,10);if(preset==='all'){const dates=visibleRequests().map(r=>r.dateIso).filter(Boolean).sort();reportFilters.from=dates[0]||localToday;reportFilters.to=dates.at(-1)||localToday}else if(preset==='month'){reportFilters.from=iso(new Date(Date.UTC(year,month-1,1)));reportFilters.to=iso(new Date(Date.UTC(year,month,0)))}else if(preset==='previous'){reportFilters.from=iso(new Date(Date.UTC(year,month-2,1)));reportFilters.to=iso(new Date(Date.UTC(year,month-1,0)))}render()}
function csvText(lines){const safe=v=>{const s=String(v??'');return /^[=+\-@\t\r]/.test(s)?"'"+s:s};return '\uFEFF'+lines.map(row=>row.map(v=>'"'+safe(v).replace(/"/g,'""')+'"').join(';')).join('\r\n')}

function payrollExportRows(){const pay=payrollSummary(reportFilters);if(pay.missing.length)throw Error('Есть заявки без расчёта.');if(!pay.rows.length)throw Error('Нет сумм для выплаты.');return [['Код агента','ФИО','Организация','Начало','Конец','Сумма','Валюта'],...pay.rows.map(x=>['AG-'+x.agentId,agentById(x.agentId)?.name,(agentById(x.agentId)?.clinicIds||[]).map(c=>clinicById(c)?.name).filter(Boolean).join(', '),reportFilters.from,reportFilters.to,decimal(x.amount),'RUB'])]}

function render(){nav();$('#content').innerHTML=({overview,requests,reports,agents,admins,clinics})[page]()}
function refreshTable(){if($('#tableResults'))$('#tableResults').innerHTML=({requests:requestTable,agents:agentTable,admins:adminTable,clinics:clinicTable})[page]()}
function open(title,body){lastFocus=document.activeElement;$('#drawerTitle').textContent=title;$('#drawerBody').innerHTML=body;$('#backdrop').classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>$('#close').focus(),50)}
function close(){if(!$('#backdrop').classList.contains('open'))return;$('#backdrop').classList.remove('open');document.body.style.overflow='';lastFocus?.focus()}
function toast(msg){const t=$('#toast');t.textContent=msg+(storageProblem?' Изменения доступны до закрытия страницы.':'');t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),4500)}
const formActions=label=>`<div class="actions"><button class="btn primary" type="submit">${label}</button><button class="btn" type="button" data-action="close">Отмена</button></div>`;
function requestForm(id){const x=visibleRequests().find(y=>y.id===id);if(!x)return;const history=data.requestHistory.filter(h=>h.requestId===id);const payoutHistory=data.payoutHistory.filter(h=>h.requestId===id);open('Заявка № '+id,`<p class="muted">${esc(x.date)} · ${esc(agentById(x.doctorId)?.name||'')}</p><dl class="details"><div><dt>Пациент</dt><dd>${esc(x.patient)}</dd></div><div><dt>Услуга</dt><dd>${esc(x.service)}</dd></div><div><dt>Стоимость</dt><dd>${money(x.amount)}</dd></div><div><dt>Вознаграждение</dt><dd>${requestReward(x)===null?'Не рассчитано':money(requestReward(x))+' · '+percent(requestRate(x))}</dd></div></dl><form id="requestForm" data-id="${id}"><div class="field"><label>Статус заявки</label><select name="status">${options(Object.entries(REQUEST_STATUSES).map(([id,name])=>({id,name})),x.status)}</select></div><div class="field"><label>Статус выплаты</label><select name="payoutStatus">${options(Object.entries(PAYOUT_STATUSES).map(([id,name])=>({id,name})),x.payoutStatus)}</select></div>${formActions('Сохранить')}</form>${history.length?`<h3>История статусов</h3>${history.map(h=>`<div class="history-item"><strong>${esc(REQUEST_STATUSES[h.old]||'Новая')} → ${esc(REQUEST_STATUSES[h.new]||'Новая')}</strong><small>${dateTime(h.date)} · ${esc(h.actor)}</small></div>`).join('')}`:''}${payoutHistory.length?`<h3>История выплат</h3>${payoutHistory.map(h=>`<div class="history-item"><strong>${esc(PAYOUT_STATUSES[h.old]||'—')} → ${esc(PAYOUT_STATUSES[h.new]||'—')}</strong><small>${dateTime(h.date)} · ${esc(h.actor)}</small></div>`).join('')}`:''}`)}
function rateModeForm(agentId,specialty){
  const a=agentById(agentId);if(!a)throw Error('Агент не найден.');
  const mode=agentRateMode(agentId,specialty),custom=agentCustomRate(agentId,specialty);
  const spName=specialtyName(specialty);
  const clinicsList=(a.clinicIds||[]).map(cid=>{const cs=clinicSpecialty(cid,specialty);return `<div><dt>${esc(clinicById(cid)?.name||'')}</dt><dd>${cs?.active?percent(cs.defaultRate):'Не задана'}</dd></div>`}).join('');
  const customOpen=mode==='custom';
  open('Вознаграждение: '+spName,
    `<dl class="details">${clinicsList||'<div><dt>Клиники</dt><dd>Не выбраны</dd></div>'}</dl>
     <form id="rateModeForm" data-id="${agentId}" data-specialty="${specialty}">
       <input type="hidden" name="mode" value="${mode}">
       <button type="button" class="rate-choice ${mode==='clinic'?'active':''}" data-mode-choice="clinic" style="width:100%;margin:8px 0;padding:16px;border:2px solid ${mode==='clinic'?'#146a70':'#d8e5e5'};border-radius:12px;background:${mode==='clinic'?'#eff7f6':'white'};text-align:left;cursor:pointer;font:inherit">
         <strong style="display:block;color:#146a70;font-size:15px">По клиникам</strong>
         <small style="display:block;color:#71888c;margin-top:4px">Процент берётся из клиники, куда направлен пациент</small>
       </button>
       <div class="rate-choice ${mode==='custom'?'active':''}" data-mode-choice="custom" style="width:100%;margin:8px 0;padding:16px;border:2px solid ${mode==='custom'?'#146a70':'#d8e5e5'};border-radius:12px;background:${mode==='custom'?'#eff7f6':'white'};cursor:pointer;font:inherit">
         <strong style="display:block;color:#146a70;font-size:15px">Личная ставка (для всех клиник)</strong>
         <small style="display:block;color:#71888c;margin-top:4px">Один процент на все клиники агента</small>
         <div class="field" id="customRateField" style="margin:12px 0 0;${customOpen?'':'display:none'}">
           <label>Процент</label>
           <input type="number" name="customRate" min="0" max="100" step="0.01" value="${custom??''}" onclick="event.stopPropagation()">
         </div>
       </div>
       <div class="actions">
         <button class="btn primary" type="submit">Сохранить</button>
         <button class="btn" type="button" data-action="close">Отмена</button>
       </div>
     </form>`
  );
}
function showAgentClinicsRates(agentId,specialty){
  const a=agentById(agentId);if(!a)return;
  const mode=agentRateMode(agentId,specialty),custom=agentCustomRate(agentId,specialty);
  const spName=specialtyName(specialty);
  const rows=(a.clinicIds||[]).map(cid=>{
    const cs=clinicSpecialty(cid,specialty);
    const rate=cs?.active?cs.defaultRate:null;
    return `<tr><td><strong>${esc(clinicById(cid)?.name||'')}</strong></td><td>${rate===null?'—':percent(rate)}</td><td>${cs?.active?pill('Действует','approved'):pill('Отключена','rejected')}</td></tr>`;
  }).join('');
  const customRow=mode==='custom'?`<tr style="background:#eff7f6"><td><strong>Личная ставка</strong> <small style="color:#146a70">(выбрано)</small></td><td><strong>${percent(custom)}</strong></td><td>${pill('Применяется','approved')}</td></tr>`:'';
  open('Проценты по клиникам',
    `<p class="muted">${esc(a.name)} · ${esc(spName)}</p>
     ${table(['Клиника','Процент','Статус'],[rows,customRow].filter(Boolean).join('')?[rows+customRow]:['<tr><td colspan="3" class="empty">Нет клиник</td></tr>'])}
     <div class="actions"><button class="btn" type="button" data-action="close">Закрыть</button></div>`
  );
}function agentForm(id){const x=agentById(id),isNew=!x;open(isNew?'Новый агент':'Редактировать агента',`<form id="agentForm" data-id="${id||''}"><div class="field"><label>ФИО</label><input name="name" required value="${esc(x?.name||'')}"></div><div class="field"><label>Электронная почта</label><input type="email" name="email" value="${esc(x?.email||'')}"></div><div class="field"><label>Телефон</label><input type="tel" name="phone" value="${esc(x?.phone||'')}"></div><div class="field"><label>Специальность</label><input name="specialty" required value="${esc(x?.specialty||'Агент')}"></div><div class="field"><label>Клиники</label><div class="multi-select" data-name="clinicIds" id="agentClinicsSelect">${(x?.clinicIds||[]).map(cid=>`<span class="multi-select-tag" data-id="${cid}">${esc(clinicById(cid)?.name||'')}<span class="x" data-remove-clinic="${cid}">×</span></span>`).join('')}${(x?.clinicIds||[]).length?'':'<span class="muted" style="font-size:13px;padding:4px 0;">Выберите клиники...</span>'}<div class="multi-select-dropdown" id="agentClinicsDropdown">${data.clinics.map(c=>`<div class="multi-select-option ${(x?.clinicIds||[]).includes(c.id)?'selected':''}" data-add-clinic="${c.id}">${esc(c.name)}</div>`).join('')}</div></div></div><div class="field"><label>Ответственный администратор</label><select id="agentAdminSelect" name="adminId"></select></div><div class="field"><label>Доступ</label><select name="active">${options([{id:'true',name:'Активен'},{id:'false',name:'Отключён'}],String(x?.active!==false))}</select></div>${formActions(isNew?'Создать агента':'Сохранить')}</form>`);setTimeout(()=>{setupMultiSelect('agentClinicsSelect','agentClinicsDropdown');setAgentAdminOptions(x?.adminId)},0)}
function setAgentAdminOptions(selected){const wrap=document.getElementById('agentClinicsSelect');if(!wrap)return;const clinicIds=wrap.clinicSelected?wrap.clinicSelected():[];const el=document.getElementById('agentAdminSelect');if(!el)return;el.innerHTML='<option value="">Не назначен</option>'+options(data.admins.filter(x=>x.active&&x.clinicIds.some(c=>clinicIds.includes(c))),selected)}
function setupMultiSelect(wrapId,dropdownId){const wrap=document.getElementById(wrapId);if(!wrap)return;const dropdown=document.getElementById(dropdownId);const selected=new Set();wrap.querySelectorAll('.multi-select-tag').forEach(t=>{if(t.dataset.id)selected.add(Number(t.dataset.id))});wrap.addEventListener('click',e=>{if(e.target.closest('.multi-select-tag')){if(e.target.dataset.removeClinic){selected.delete(Number(e.target.dataset.removeClinic));e.stopPropagation();renderTags()}}else{dropdown.classList.toggle('show')}});wrap.addEventListener('mouseenter',()=>dropdown.classList.add('show'));wrap.addEventListener('mouseleave',()=>dropdown.classList.remove('show'));dropdown.querySelectorAll('.multi-select-option').forEach(opt=>{opt.addEventListener('click',e=>{e.stopPropagation();const cid=Number(opt.dataset.addClinic);if(selected.has(cid))selected.delete(cid);else selected.add(cid);renderTags();dropdown.classList.add('show');if(wrapId==='agentClinicsSelect')setAgentAdminOptions()})});function renderTags(){wrap.querySelectorAll('.multi-select-tag').forEach(t=>t.remove());wrap.querySelector('span.muted')?.remove();const arr=[...selected];wrap.insertAdjacentHTML('afterbegin',arr.map(cid=>`<span class="multi-select-tag" data-id="${cid}">${esc(clinicById(cid)?.name||'')}<span class="x" data-remove-clinic="${cid}">×</span></span>`).join(''));if(!arr.length)wrap.insertAdjacentHTML('afterbegin','<span class="muted" style="font-size:13px;padding:4px 0;">Выберите клиники...</span>');dropdown.querySelectorAll('.multi-select-option').forEach(o=>{o.classList.toggle('selected',selected.has(Number(o.dataset.addClinic)))})}wrap.clinicSelected=()=>[...selected]}
function succeed(message){close();render();toast(message)}
function onClick(e){
  const p=e.target.closest('[data-page]');if(p){navigate(p.dataset.page,{agent:p.dataset.agent,clinic:p.dataset.clinic,admin:p.dataset.admin});return}
  const report=e.target.closest('[data-report-preview]');if(report){reportPreview=report.dataset.reportPreview;refreshReports();return}
  const clinicTab=e.target.closest('[data-clinic-tab]');if(clinicTab){clinicSettingsTab=clinicTab.dataset.clinicTab;render();return}
  const t=e.target.closest('[data-tab]');if(t){profileTab=t.dataset.tab;render();return}
  const a=e.target.closest('[data-action]');if(!a)return;const id=Number(a.dataset.id);
  try{switch(a.dataset.action){
    case'request':requestForm(id);break;
    case'adminProfile':case'adminProfileFromOverview':navigate('admins',{admin:id});break;
    case'editAdmin':adminForm(id);break;
    case'deleteAdmin':if(!confirm('Удалить профиль администратора?'))return;deleteAdminAccount(id);succeed('Профиль удалён');break;
    case'rateMode':rateModeForm(id,a.dataset.specialty);break;
    case'agentClinicsRates':showAgentClinicsRates(id,a.dataset.specialty);break;
    case'newAgent':agentForm();break;
    case'editAgent':agentForm(id);break;
    case'newAdmin':adminForm();break;
    case'registration':registrationForm(id);break;
    case'newClinic':clinicForm();break;
    case'clinic':clinicForm(id);break;
    case'newClinicSpecialty':clinicSpecialtyForm(id);break;
    case'editClinicSpecialty':clinicSpecialtyForm(id,a.dataset.specialty);break;
    case'close':close();break;
    case'exportPayroll':exportPayroll();break;
    case'exportAnalyst':exportAnalyst();break;
    case'reportPreset':setReportPreset(a.dataset.preset);break;
  }}
  catch(error){toast(error.message)}
}
function onRateChoice(e){
  if(e.target.closest('#customRateField'))return;
  const b=e.target.closest('[data-mode-choice]');if(!b)return;
  const form=b.closest('form');if(!form)return;
  const mode=b.dataset.modeChoice;
  form.querySelector('input[name="mode"]').value=mode;
  form.querySelectorAll('.rate-choice').forEach(el=>{
    const active=el.dataset.modeChoice===mode;
    el.classList.toggle('active',active);
    el.style.borderColor=active?'#146a70':'#d8e5e5';
    el.style.background=active?'#eff7f6':'white';
  });
  const f=form.querySelector('#customRateField');
  if(f)f.style.display=mode==='custom'?'':'none';
}
function onChange(e){const el=e.target;
  try{
    if(el.id==='clinicSpecialtyStatus'){clinicSpecialtyStatus=el.value;$('#clinicSpecialtyResults').innerHTML=clinicSpecialtyTable(clinicSettingsId);return}
    if(el.id==='registrationFilter'){registrationFilter=el.value;if($('#regResults'))$('#regResults').innerHTML=registrationTable();return}
    if(el.id==='registrationClinicFilter'){registrationClinicFilter=el.value;if($('#regResults'))$('#regResults').innerHTML=registrationTable();return}
    if(el.id==='adminStatusFilter'){adminStatusFilter=el.value;refreshTable();return}
    if(el.id==='adminClinicFilter'){adminClinicFilter=el.value;refreshTable();return}
    if(el.dataset.reportField){reportFilters[el.dataset.reportField]=el.value;refreshReports();return}
    if(el.id==='filter'){filter=el.value;refreshTable();return}
    if(el.id==='payoutFilter'){payoutFilter=el.value;refreshTable();return}
    if(el.id==='specialtyFilter'){specialtyFilter=el.value;refreshTable();return}
    if(el.id==='historyFilter'){profileHistoryFilter=el.value;$('#rateResults').innerHTML=rateHistory(profileId);return}
    if(el.id==='clinicSpecialtySource'){const selected=SPECIALTIES.find(s=>s[0]===el.value);const nameEl=document.querySelector('[name="name"]');const detailEl=document.querySelector('[name="detail"]');if(nameEl)nameEl.value=selected?.[1]||'';if(detailEl)detailEl.value=selected?.[2]||'';return}
  }catch(error){toast(error.message);render()}
}
function onInput(e){if(e.target.id==='clinicSpecialtySearch'){clinicSpecialtyQuery=e.target.value;$('#clinicSpecialtyResults').innerHTML=clinicSpecialtyTable(clinicSettingsId)}if(e.target.id==='search'){query=e.target.value;refreshTable()}if(e.target.id==='searchReg'){query=e.target.value;if($('#regResults'))$('#regResults').innerHTML=registrationTable()}if(e.target.id==='profileSearch'){profileQuery=e.target.value;$('#rateResults').innerHTML=rateTable(agentById(profileId))}}
function onSubmit(e){
  e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f)),id=Number(f.dataset.id);
  try{
    if(f.id==='requestForm'){const r=data.requests.find(x=>x.id===id);if(v.status!==r.status)setRequestStatus(id,v.status);if(v.payoutStatus!==r.payoutStatus)setPayout(id,v.payoutStatus,'','');succeed('Заявка обновлена')}
    if(f.id==='rateModeForm'){setAgentRateMode(id,f.dataset.specialty,v.mode,v.customRate);succeed('Вознаграждение обновлено')}    
    if(f.id==='clinicSpecialtyForm'){saveClinicSpecialty(id,f.dataset.specialty||null,v);succeed('Специализация сохранена')}
    if(f.id==='agentForm'){const wrap=document.getElementById('agentClinicsSelect');const clinicIds=wrap?.clinicSelected?wrap.clinicSelected():[];saveAgentProfile(id,{...v,clinicIds});succeed(id?'Профиль агента обновлён':'Агент добавлен.')}
    if(f.id==='adminForm'){const wrap=document.getElementById('adminClinicsSelect');const clinicIds=wrap?.clinicSelected?wrap.clinicSelected():[];saveAdminAccount(id,{...v,clinicIds});succeed(id?'Настройки администратора сохранены':'Администратор создан')}
    if(f.id==='registrationDecisionForm'){const created=decideRegistration(id,v.decision,v.adminId,v.reason);succeed(created?'Регистрация одобрена. Агент создан.':'Регистрация отклонена.')}
    if(f.id==='clinicForm'){saveClinic(id,v);succeed(id?'Клиника обновлена':'Клиника создана')}
  }catch(error){toast(error.message)}
}
document.addEventListener('click',onRateChoice);
document.addEventListener('click',onClick);
document.addEventListener('change',onChange);document.addEventListener('input',onInput);document.addEventListener('submit',onSubmit);
$('#close').onclick=close;
$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();$('#sidebar').classList.remove('open')}});
window.addEventListener('hashchange',readRoute);readRoute();
</script></body></html>
