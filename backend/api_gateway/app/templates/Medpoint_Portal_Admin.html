<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medpoint · Шеф</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23144753'/%3E%3Cpath d='M32 15v34M15 32h34' stroke='%23fff' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E"><style>
:root{font-family:Manrope,Arial,sans-serif;color:#193337;background:#f5f8f8}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e5b842;outline-offset:3px}
.app{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:100vh}
.side{background:#103b44;color:#d6e7e9;padding:24px 12px;display:flex;flex-direction:column;gap:30px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px;color:white;font-size:19px;font-weight:800;letter-spacing:-.04em;margin-bottom:20px}
.mark{background:#f5d77e;color:#103b44;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:26px;line-height:1;flex-shrink:0}
.nav{display:grid;gap:5px}
.nav button{border:0;background:transparent;color:#c8dcdf;text-align:left;border-radius:10px;padding:12px 10px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:14px}
.nav button:hover,.nav button.active{background:#28545d;color:white}
.nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-count{margin-left:auto;background:#f5d77e;color:#103b44;border-radius:20px;padding:1px 6px;font-size:12px;font-weight:800}
.sidefoot{margin-top:auto;border-top:1px solid #315a62;padding:20px 10px 0;font-size:13px;color:#aac6ca;line-height:1.5}
.sidefoot strong{display:block;color:white;font-size:14px}
.main{min-width:0}
.top{height:78px;background:white;border-bottom:1px solid #e2ebeb;display:flex;align-items:center;justify-content:space-between;padding:0 38px;gap:20px;position:sticky;top:0;z-index:2}
.top-brand{display:flex;align-items:center;gap:12px;color:#193337;font-size:19px;font-weight:800;letter-spacing:-.04em}
.topright{display:flex;align-items:center;gap:12px;margin-left:auto}
.top-user{font-size:13px;font-weight:700;color:#31565b;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{height:36px;width:36px;border-radius:50%;background:#d8ebe8;display:grid;place-items:center;font-weight:800;color:#22585b}
.mobilemenu{display:none;background:none;border:0;font-size:22px;color:#245159}
.content{padding:35px 38px 60px;max-width:1700px;margin:auto}
.heading{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.heading>div{min-width:0}
h1{font-size:29px;letter-spacing:-.045em;margin:0;line-height:1.2;color:#193337}
h2{font-size:19px;letter-spacing:-.03em;margin:0;color:#193337}
.muted{color:#748b90;font-size:14px;margin:7px 0 0}
.btn{border:2px solid #146a70;background:white;color:#146a70;border-radius:10px;padding:9px 15px;font-size:14px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#e6f2f1}
.btn.primary{background:#146a70;color:white;border-color:#146a70}
.btn.primary:hover{background:#10585d}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.danger-access{background:#fff4f4;color:#a52d36;border-color:#e8b7b7}
.btn.danger-access:hover{background:#ffe0e0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px}
.stat{background:white;border:1px solid #e0eaea;border-radius:15px;padding:19px 21px;min-height:116px;box-shadow:0 4px 18px #294f5208;text-align:left;color:inherit;font:inherit;display:block}
.stat-action{transition:transform .15s,border-color .15s}
.stat-action:hover{border-color:#42999c;transform:translateY(-2px)}
.stat-lbl{font-size:13px;color:#71888d;font-weight:600;display:block}
.stat strong{display:block;font-size:29px;margin:8px 0 1px;letter-spacing:-.05em;font-weight:800;color:#193337}
.stat em{font-size:12px;color:#18836f;font-style:normal;display:block}
.panel{background:white;border:1px solid #e1eaea;border-radius:15px;box-shadow:0 4px 18px #294f5208;overflow:hidden;margin-bottom:20px}
.panelhead{display:flex;align-items:center;justify-content:space-between;padding:21px 22px;border-bottom:1px solid #edf2f2;gap:12px;flex-wrap:wrap}
.panelhead p{margin:5px 0 0;color:#82989c;font-size:13px}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.search,select.filter{height:40px;border:1px solid #dce7e7;border-radius:9px;background:white;padding:0 12px;color:#26494d;font-size:14px}
.search{width:230px}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8a9fa2;background:#fbfcfc;padding:13px 22px}
td{padding:15px 22px;border-top:1px solid #eff3f3;font-size:14px;vertical-align:middle}
td strong{display:block;color:#1d3d42}
td small{color:#8da1a4;font-size:12px;display:block;margin-top:4px;line-height:1.5}
td.wrap{white-space:normal;min-width:170px;max-width:260px;line-height:1.5}
.pill{display:inline-block;border-radius:50px;padding:6px 10px;font-size:12px;font-weight:800;background:#edf3f3;color:#547078}
.pill.new{background:#fff1dc;color:#a16a17}
.pill.approved{background:#e6f6ec;color:#217453}
.pill.rejected{background:#fceced;color:#ae505a}
.unset{color:#94671e;font-weight:700;font-size:13px}
.initials{display:grid;place-items:center;width:38px;height:38px;flex-shrink:0;border-radius:12px;background:#e7f2f1;color:#287977;font-weight:800}
.agent-overview{display:flex;gap:13px;align-items:center;width:100%;border:0;border-bottom:1px solid #edf2f2;background:white;padding:17px 22px;text-align:left;color:#1d4147;font-size:14px}
.agent-overview strong{display:block}
.agent-overview small{display:block;color:#728d92;margin-top:3px;font-size:12px}
.split{display:grid;grid-template-columns:1.45fr 1fr;gap:20px}
.change-item{display:grid;grid-template-columns:1fr auto;gap:14px;padding:14px 22px;border-bottom:1px solid #edf2f2;font-size:14px;align-items:start}
.change-item:last-child{border-bottom:0}
.change-item-body strong{display:block;color:#1d3d42;font-weight:700;margin-bottom:3px}
.change-item-body small{display:block;color:#71888d;font-size:13px;line-height:1.5}
.change-item-time{color:#8da1a4;font-size:12px;white-space:nowrap;text-align:right}
.empty{padding:40px;text-align:center;color:#738b90;white-space:normal;line-height:1.7}
.backdrop{position:fixed;inset:0;background:#0d2c35a8;display:none;justify-content:center;align-items:center;z-index:3;padding:20px;overflow-y:auto}
.backdrop.open{display:flex}
.drawer{background:white;width:min(560px,100%);max-height:90vh;overflow:auto;padding:28px;box-shadow:0 24px 60px #102f3450;border-radius:16px;position:relative;margin:auto}
.drawer header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:14px}
.drawer header h2{margin:0}
.drawer header button{border:0;background:#eef4f4;border-radius:8px;width:33px;height:33px;font-size:22px;line-height:1;flex-shrink:0}
.field{display:grid;gap:7px;margin:15px 0}
.field label{font-size:13px;font-weight:800;color:#526d73}
.field input,.field select,.field textarea{border:1px solid #d8e5e5;border-radius:8px;padding:11px 12px;width:100%;background:white;color:#173b40;font:inherit}
.field textarea{resize:vertical;min-height:85px}
.field input:disabled{background:#f0f4f4;color:#8da0a0}
.drawer .actions{display:flex;gap:9px;margin-top:24px;flex-wrap:wrap}
.note{background:#edf7f5;border-radius:9px;padding:13px;font-size:13px;color:#42676a;line-height:1.5;margin:14px 0}
.details>div{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #edf1f1;font-size:14px;line-height:1.5}
.details dt{color:#748b90}.details dd{margin:0;text-align:right;font-weight:700}
.profile-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px;padding:23px}
.meta-label{display:block;color:#799094;font-size:12px;margin-bottom:7px}
.profile-summary strong{font-size:14px;line-height:1.6;font-weight:700}
.back-link{margin-bottom:16px;display:inline-flex;align-items:center;gap:6px}
.toast{position:fixed;bottom:20px;right:20px;padding:13px 18px;background:#173e46;color:white;border-radius:10px;box-shadow:0 12px 30px #1236;display:none;z-index:5;font-size:14px;max-width:calc(100vw - 40px);line-height:1.6}
.toast.show{display:block}
.multi-select{position:relative;border:1px solid #d8e5e5;border-radius:8px;background:white;padding:8px 10px;min-height:44px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;cursor:pointer}
.multi-select-tag{display:inline-flex;align-items:center;gap:6px;background:#e7f2f1;color:#146a70;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:600}
.multi-select-tag .x{cursor:pointer;color:#287977;font-weight:800;font-size:14px;line-height:1}
.multi-select-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:white;border:1px solid #d8e5e5;border-radius:8px;box-shadow:0 10px 30px #1238;max-height:240px;overflow-y:auto;z-index:10;display:none}
.multi-select-dropdown.show{display:block}
.multi-select-option{padding:10px 14px;cursor:pointer;font-size:14px}
.multi-select-option:hover{background:#e6f2f1}
.multi-select-option.selected{background:#eff7f6;color:#146a70;font-weight:700}
.report-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.report-tag{font-size:11px;letter-spacing:.12em;color:#548487;font-weight:800;margin-bottom:13px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.app{grid-template-columns:180px 1fr}.content{padding:26px 22px}.top{padding:0 22px}}
@media(max-width:700px){.app{display:block}.side{display:none;position:fixed;inset:0 auto 0 0;width:250px;z-index:4;height:100vh;overflow-y:auto}.side.open{display:flex}.mobilemenu{display:block}.top{height:66px;padding:0 15px}.content{padding:24px 15px}.grid{gap:9px}.split{grid-template-columns:1fr}.profile-summary{grid-template-columns:1fr}.report-cards{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side" id="sidebar"><div><div class="brand"><span class="mark">+</span> Medpoint</div><nav class="nav" id="nav"></nav></div><div class="sidefoot"><strong id="userLabel">Шеф</strong><span id="userSub">Управление сетью</span></div></aside><main class="main"><div class="top"><button class="mobilemenu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div class="top-brand"><span class="mark">+</span> Medpoint</div><div class="topright"><span class="top-user" id="topUserName">Шеф</span><div class="avatar" id="topAvatar">Ш</div><button class="btn small" id="logoutBtn">Выйти</button></div></div><div class="content" id="content"></div></main></div><div class="backdrop" id="backdrop"><div class="drawer"><header><h2 id="drawerTitle"></h2><button id="close">×</button></header><div id="drawerBody"></div></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=v=>v?new Date(v).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}):'—';
const API='/api/v1';
const S={user:null,agents:[],admins:[],clinics:[],specs:[]};
let page='overview',query='',agentFilter='all',agentId=null,adminId=null,clinicId=null;

const NAME={overview:'Обзор',pending:'Заявки',admins:'Администраторы',agents:'Агенты',clinics:'Клиники',reports:'Отчёты'};
const SL={pending:'Ожидает',active:'Активен',inactive:'Отключён',rejected:'Отклонён'};
const SP={pending:'new',active:'approved',inactive:'rejected',rejected:'rejected'};
const NAV=['overview','pending','admins','agents','clinics','reports'];

async function api(p,o={}){
  const r=await fetch(API+p,{credentials:'include',...o});
  if(r.status===401){location.href='/';throw new Error('401')}
  if(r.status===403)throw new Error('Нет доступа');
  const t=await r.text();let d=null;
  if(t){try{d=JSON.parse(t)}catch{d=t}}
  if(!r.ok)throw new Error((d&&d.detail)||(d&&d.error)||('HTTP '+r.status));
  return d;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),4000);}
function openDrawer(title,body){$('#drawerTitle').textContent=title;$('#drawerBody').innerHTML=body;$('#backdrop').classList.add('open');document.body.style.overflow='hidden';}
function closeDrawer(){$('#backdrop').classList.remove('open');document.body.style.overflow='';}

const cName=id=>S.clinics.find(c=>c.id===Number(id))?.name||'—';
const aName=id=>S.admins.find(a=>a.id===Number(id))?.full_name||'—';
const sName=id=>S.specs.find(s=>s.id===Number(id))?.name||('#'+id);
const heading=(t,d,act='')=>`<div class="heading"><div><h1>${esc(t)}</h1>${d?`<p class="muted">${esc(d)}</p>`:''}</div>${act}</div>`;
const table=(h,rows)=>`<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${h.length}" class="empty">Ничего не найдено</td></tr>`}</tbody></table></div>`;
const pill=(l,t='')=>`<span class="pill ${t}">${esc(l)}</span>`;

async function loadAll(){
  try{
    const [a,ad,c,s]=await Promise.all([api('/agents'),api('/admins'),api('/clinics'),api('/specializations')]);
    S.agents=a||[];S.admins=ad||[];S.clinics=c||[];S.specs=s||[];
  }catch(e){toast('Ошибка загрузки: '+e.message);}
}
function navigate(p){page=p;agentId=null;adminId=null;clinicId=null;query='';location.hash=p;render();scrollTo(0,0);}
function render(){nav();const m={overview,requests,admins,agents,clinics,reports,pending:requests};$('#content').innerHTML=(m[page]||overview)();}
function nav(){
  const pc=S.agents.filter(a=>a.status==='pending').length;
  $('#nav').innerHTML=NAV.map(t=>`<button class="${page===t?'active':''}" data-page="${t}">${NAME[t]}${t==='pending'&&pc?`<span class="nav-count">${pc}</span>`:''}</button>`).join('');
  const u=S.user||{};
  $('#userLabel').textContent=u.full_name||'Шеф';$('#topUserName').textContent=u.full_name||'Шеф';
  $('#topAvatar').textContent=(u.full_name||'Ш').split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase();
  $('#sidebar').classList.remove('open');
}

function overview(){
  const pend=S.agents.filter(a=>a.status==='pending'),act=S.agents.filter(a=>a.status==='active');
  return heading('Обзор','Сводная информация по порталу')
    +`<div class="grid">${[{l:'Заявки',v:pend.length,d:'Новые агенты',p:'pending'},{l:'Администраторы',v:S.admins.length,d:'Всего',p:'admins'},{l:'Агенты',v:act.length,d:'Активные',p:'agents'},{l:'Клиники',v:S.clinics.length,d:'Всего',p:'clinics'}].map(i=>`<button class="stat stat-action" data-page="${i.p}"><span class="stat-lbl">${i.l}</span><strong>${i.v}</strong><em>${i.d}</em></button>`).join('')}</div>`
    +`<div class="split"><section class="panel"><div class="panelhead"><div><h2>Новые заявки</h2><p>Ожидают рассмотрения</p></div><button class="btn small" data-page="pending">Все</button></div>${pend.length?pend.slice(0,5).map(a=>`<div class="agent-overview"><span class="initials">${esc((a.full_name||'?').split(' ').map(n=>n[0]).join('').slice(0,2))}</span><span class="agent-overview-info"><strong>${esc(a.full_name)}</strong><small>${esc(a.email)}</small></span><button class="btn small" data-action="viewAgent" data-id="${a.id}">Открыть</button></div>`).join(''):'<div class="empty">Заявок нет</div>'}</section><section class="panel"><div class="panelhead"><div><h2>Администраторы</h2></div><button class="btn small" data-page="admins">Все</button></div>${S.admins.length?S.admins.slice(0,5).map(a=>`<div class="agent-overview"><span class="initials">${esc((a.full_name||'?').split(' ').map(n=>n[0]).join('').slice(0,2))}</span><span class="agent-overview-info"><strong>${esc(a.full_name)}</strong><small>${esc(a.email)}</small></span><button class="btn small" data-action="viewAdmin" data-id="${a.id}">Профиль</button></div>`).join(''):'<div class="empty">Администраторов нет</div>'}</section></div>`;
}

function requests(){
  const list=S.agents.filter(a=>a.status==='pending').filter(a=>!query||[a.full_name,a.email].join(' ').toLowerCase().includes(query.toLowerCase()));
  return heading('Заявки','Ожидают одобрения')+`<section class="panel"><div class="panelhead"><input class="search" id="search" placeholder="Имя или email" value="${esc(query)}"></div>${table(['Кандидат','Email','Телефон','Дата',''],list.map(a=>`<tr><td><strong>${esc(a.full_name)}</strong><small>#${a.id}</small></td><td>${esc(a.email)}</td><td>${esc(a.phone||'—')}</td><td>${dt(a.created_at)}</td><td><button class="btn small" data-action="viewAgent" data-id="${a.id}">Рассмотреть</button></td></tr>`))}</section>`;
}

function agents(){
  if(agentId)return agentProfile();
  const list=S.agents.filter(a=>agentFilter==='all'||a.status===agentFilter).filter(a=>!query||[a.full_name,a.email,a.phone||''].join(' ').toLowerCase().includes(query.toLowerCase()));
  return heading('Агенты','Управление агентами')+`<section class="panel"><div class="panelhead"><div class="controls"><input class="search" id="search" placeholder="Имя, email" value="${esc(query)}"><select class="filter" id="agentStatusFilter">${['all','pending','active','inactive','rejected'].map(s=>`<option value="${s}" ${s===agentFilter?'selected':''}>${s==='all'?'Все статусы':SL[s]}</option>`).join('')}</select></div></div>${table(['Агент','Email','Статус','Клиники','Админ',''],list.map(a=>`<tr><td><strong>${esc(a.full_name)}</strong><small>#${a.id}</small></td><td>${esc(a.email)}</td><td>${pill(SL[a.status]||a.status,SP[a.status]||'')}</td><td>${(a.clinic_ids||[]).map(cName).filter(Boolean).join(', ')||'—'}</td><td>${esc(aName(a.admin_id))}</td><td><button class="btn small" data-action="viewAgent" data-id="${a.id}">Профиль</button></td></tr>`))}</section>`;
}

function agentProfile(){
  const a=S.agents.find(x=>x.id===Number(agentId));
  if(!a)return heading('Не найден','','<button class="btn small" data-page="agents">← Назад</button>');
  return `<button class="btn small back-link" data-page="agents">← Назад</button>`+heading(a.full_name,`#${a.id} · ${a.email}`,
    `<div style="display:flex;gap:10px;flex-wrap:wrap">${a.status==='pending'?`<button class="btn primary" data-action="approve" data-id="${a.id}">Одобрить</button><button class="btn danger-access" data-action="reject" data-id="${a.id}">Отклонить</button>`:''}<button class="btn" data-action="editAgent" data-id="${a.id}">Редактировать</button><button class="btn danger-access" data-action="delAgent" data-id="${a.id}">Удалить</button></div>`)
    +`<section class="panel profile-summary"><div><span class="meta-label">Статус</span>${pill(SL[a.status]||a.status,SP[a.status]||'')}</div><div><span class="meta-label">Телефон</span><strong>${esc(a.phone||'—')}</strong></div><div><span class="meta-label">Опыт</span><strong>${esc(a.experience||'—')}</strong></div><div><span class="meta-label">Админ</span><strong>${esc(aName(a.admin_id))}</strong></div><div style="grid-column:1/-1"><span class="meta-label">О себе</span><strong>${esc(a.about_myself||'—')}</strong></div></section>`
    +`<section class="panel"><div class="panelhead"><h2>Клиники</h2></div><div style="padding:18px 22px">${(a.clinic_ids||[]).length?(a.clinic_ids||[]).map(id=>`<span class="multi-select-tag" style="margin:0 6px 6px 0">${esc(cName(id))}</span>`).join(''):'<span class="muted">Не привязан</span>'}</div></section>`
    +`<section class="panel"><div class="panelhead"><h2>Специализации</h2></div><div style="padding:18px 22px">${(a.specialization_ids||[]).length?(a.specialization_ids||[]).map(id=>`<span class="multi-select-tag" style="margin:0 6px 6px 0">${esc(sName(id))}</span>`).join(''):'<span class="muted">Нет</span>'}</div></section>`;
}

function admins(){
  if(adminId)return adminProfile();
  const list=S.admins.filter(a=>!query||[a.full_name,a.email].join(' ').toLowerCase().includes(query.toLowerCase()));

function multiSelectHtml(wrapId,dropId,items,initial){
  return `<div class="multi-select" id="${wrapId}"><span class="muted" style="font-size:13px">Выберите...</span><div class="multi-select-dropdown" id="${dropId}"></div></div>`;
}
function setupMultiSelect(wrapId,dropId,items,initial,onChange){
  const wrap=document.getElementById(wrapId),drop=document.getElementById(dropId);
  if(!wrap||!drop)return;
  const sel=new Set(initial||[]);
  function render(){
    wrap.querySelectorAll('.multi-select-tag').forEach(t=>t.remove());
    const m=wrap.querySelector('span.muted');if(m)m.remove();
    if(!sel.size)wrap.insertAdjacentHTML('afterbegin','<span class="muted" style="font-size:13px">Выберите...</span>');
    [...sel].forEach(id=>{const it=items.find(x=>Number(x.id)===Number(id));wrap.insertAdjacentHTML('afterbegin',`<span class="multi-select-tag" data-id="${id}">${esc(it?.name||('#'+id))}<span class="x" data-remove="${id}">×</span></span>`);});
    drop.innerHTML=items.map(it=>`<div class="multi-select-option ${sel.has(Number(it.id))?'selected':''}" data-add="${it.id}">${esc(it.name)}</div>`).join('');
  }
  render();
  wrap.addEventListener('click',e=>{const rm=e.target.closest('[data-remove]');if(rm){sel.delete(Number(rm.dataset.remove));render();onChange([...sel]);e.stopPropagation();return;}if(!e.target.closest('.multi-select-option'))drop.classList.toggle('show');});
  drop.addEventListener('click',e=>{const o=e.target.closest('[data-add]');if(!o)return;const id=Number(o.dataset.add);if(sel.has(id))sel.delete(id);else sel.add(id);render();onChange([...sel]);drop.classList.add('show');e.stopPropagation();});
  document.addEventListener('click',e=>{if(!wrap.contains(e.target))drop.classList.remove('show');});
}

// ===== Обработчики =====
document.addEventListener('click',async e=>{
  const pg=e.target.closest('[data-page]');if(pg){navigate(pg.dataset.page);return;}
  const a=e.target.closest('[data-action]');if(!a)return;
  const id=Number(a.dataset.id);
  try{
    switch(a.dataset.action){
      case 'viewAgent':agentId=id;page='agents';render();scrollTo(0,0);break;
      case 'viewAdmin':adminId=id;page='admins';render();scrollTo(0,0);break;
      case 'clinicSettings':clinicId=id;page='clinics';render();scrollTo(0,0);
        document.getElementById('clinicSpecsBlock').innerHTML=await clinicSpecsHtml(id);break;
      case 'approve':openApprove(id);break;
      case 'reject':openReject(id);break;
      case 'editAgent':openEditAgent(id);break;
      case 'delAgent':
        if(!confirm('Удалить агента?'))return;
        await api(`/agents/${id}`,{method:'DELETE'});toast('Удалён');await loadAll();navigate('agents');break;
      case 'editAdmin':openAdminForm(id);break;
      case 'newAdmin':openAdminForm();break;
      case 'delAdmin':
        if(!confirm('Удалить администратора?'))return;
        await api(`/admins/${id}`,{method:'DELETE'});toast('Удалён');await loadAll();navigate('admins');break;
      case 'newClinic':openClinicForm();break;
      case 'editClinic':openClinicForm(id);break;
      case 'editSpec':openEditSpec(a.dataset.clinic,a.dataset.spec,a.dataset.rate,a.dataset.active);break;
    }
  }catch(err){toast('Ошибка: '+err.message);}
});

document.addEventListener('change',e=>{
  if(e.target.id==='agentStatusFilter'){agentFilter=e.target.value;render();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='search'){query=e.target.value;render();}
});

document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,fd=new FormData(f);
  try{
    if(f.id==='approveForm'){
      const id=Number(f.dataset.id);
      if(!selClinicIds.length)throw new Error('Выберите хотя бы одну клинику');
      await api(`/agents/${id}/approve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clinic_ids:selClinicIds,specialization_ids:selSpecIds,admin_id:fd.get('admin_id')?Number(fd.get('admin_id')):null})});
      toast('Агент одобрен');closeDrawer();await loadAll();render();
    }
    if(f.id==='rejectForm'){
      const id=Number(f.dataset.id);
      const reason=String(fd.get('decision_reason')||'').trim();
      if(!reason)throw new Error('Укажите причину');
      await api(`/agents/${id}/reject`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision_reason:reason})});
      toast('Агент отклонён');closeDrawer();await loadAll();render();
    }
    if(f.id==='editAgentForm'){
      const id=Number(f.dataset.id);
      await api(`/agents/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:fd.get('full_name'),phone:fd.get('phone')||null,status:fd.get('status'),clinic_ids:selClinicIds,specialization_ids:selSpecIds,admin_id:fd.get('admin_id')?Number(fd.get('admin_id')):null})});
      toast('Агент обновлён');closeDrawer();await loadAll();render();
    }
    if(f.id==='adminForm'){
      const id=f.dataset.id?Number(f.dataset.id):null;
      const permissions={reviewRegistrations:!!fd.get('reviewRegistrations')};
      if(id){
        await api(`/admins/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:fd.get('full_name'),phone:fd.get('phone')||null,active:fd.get('active')==='true',permissions,clinic_ids:selAdminClinicIds})});
        toast('Обновлён');
      }else{
        await api(`/admins`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:fd.get('email'),password:fd.get('password'),full_name:fd.get('full_name'),phone:fd.get('phone')||null,permissions,clinic_ids:selAdminClinicIds})});
        toast('Создан');
      }
      closeDrawer();await loadAll();render();
    }
    if(f.id==='clinicForm'){
      const id=f.dataset.id?Number(f.dataset.id):null;
      const body={name:fd.get('name'),city:fd.get('city'),address:fd.get('address')||null,phone:fd.get('phone')||null,active:fd.get('active')==='true'};
      if(id)await api(`/clinics/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      else await api(`/clinics`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      toast(id?'Обновлена':'Создана');closeDrawer();await loadAll();render();
    }
    if(f.id==='specForm'){
      const cid=Number(f.dataset.clinic),sid=Number(f.dataset.spec);
      const r=String(fd.get('default_rate')||'').trim();
      await api(`/clinics/${cid}/specialties/${sid}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({default_rate:r===''?null:Number(r),active:fd.get('active')==='true'})});
      toast('Сохранено');closeDrawer();
      document.getElementById('clinicSpecsBlock').innerHTML=await clinicSpecsHtml(cid);
    }
  }catch(err){toast('Ошибка: '+err.message);}
});
