<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клиники - MedReferral</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary-color: #0ea5e9;
            --accent-color: #8b5cf6;
            --light-color: #f8fafc;
            --dark-color: #1e293b;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --info-color: #3b82f6;
            --gray-color: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }

        body {
            background-color: #f1f5f9;
            color: var(--dark-color);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            background-color: white;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .logo i {
            font-size: 1.8rem;
        }

        .btn {
            padding: 10px 20px;
            border-radius: var(--border-radius);
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-success {
            background-color: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background-color: #0da271;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.875rem;
        }

        /* Main Layout */
        .main-layout {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: white;
            box-shadow: var(--shadow);
            padding: 20px 0;
            position: sticky;
            top: 70px;
            height: calc(100vh - 70px);
            overflow-y: auto;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin-bottom: 5px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            color: var(--dark-color);
            text-decoration: none;
            transition: var(--transition);
            border-left: 3px solid transparent;
        }

        .sidebar-menu a:hover {
            background-color: #f1f5f9;
            color: var(--primary-color);
        }

        .sidebar-menu a.active {
            background-color: #eff6ff;
            color: var(--primary-color);
            border-left-color: var(--primary-color);
            font-weight: 600;
        }

        .sidebar-menu i {
            width: 20px;
            text-align: center;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .page-header h1 {
            font-size: 1.8rem;
            color: var(--dark-color);
        }

        .page-header h1 i {
            color: var(--primary-color);
            margin-right: 10px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .stat-content {
            flex: 1;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--gray-color);
        }

        /* Clinics List */
        .clinics-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .clinic-item {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            border: 2px solid transparent;
        }

        .clinic-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-color);
        }

        .clinic-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .clinic-name {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--dark-color);
        }

        .clinic-address {
            font-size: 0.95rem;
            color: var(--gray-color);
        }

        .clinic-address i {
            margin-right: 8px;
            color: var(--primary-color);
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--gray-color);
        }

        .loading-spinner i {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        /* User Panel */
        #userPanel {
            display: none;
            align-items: center;
            gap: 15px;
            margin-left: 15px;
        }

        #userName {
            font-weight: 500;
            text-align: right;
            line-height: 1.3;
        }

        #userName span {
            font-weight: 400;
            font-size: 0.9rem;
            color: var(--gray-color);
        }

        #userAvatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* Toast */
        #toastContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            max-width: 420px;
            animation: slideIn 0.3s ease;
            transition: all 0.3s ease;
        }

        .toast.success {
            background: var(--success-color);
        }

        .toast.error {
            background: #dc2626;
        }

        .toast.info {
            background: var(--primary-color);
        }

        @keyframes slideIn {
            from { transform: translateX(40px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--border-color);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--dark-color);
        }

        .empty-state p {
            color: var(--gray-color);
            margin-bottom: 30px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .main-layout {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                margin-bottom: 20px;
            }
            
            .sidebar-menu {
                display: flex;
                overflow-x: auto;
            }
            
            .sidebar-menu li {
                flex-shrink: 0;
                margin-bottom: 0;
            }
            
            .sidebar-menu a {
                border-left: none;
                border-bottom: 3px solid transparent;
                white-space: nowrap;
            }
            
            .sidebar-menu a.active {
                border-left: none;
                border-bottom-color: var(--primary-color);
            }
        }

        @media (max-width: 768px) {
            .clinic-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Toast контейнер -->
    <div id="toastContainer"></div>

    <!-- Header -->
    <header>
        <div class="container">
            <nav class="navbar">
                <a href="index" class="logo">
                    <i class="fas fa-hospital-alt"></i>
                    MedReferral
                </a>
                
                <div id="userPanel" style="display: none;">
                    <span id="userName" style="font-weight: 500;"></span>
                    <div id="userAvatar"></div>
                    <button class="btn btn-outline" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Выйти
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li>
                    <a href="dashboard">
                        <i class="fas fa-home"></i> Главная
                    </a>
                </li>
                <li>
                    <a href="create_referral">
                        <i class="fas fa-plus-circle"></i> Новое направление
                    </a>
                </li>
                <li>
                    <a href="referrals">
                        <i class="fas fa-list"></i> Мои направления
                    </a>
                </li>
                <li>
                    <a href="patients">
                        <i class="fas fa-user-injured"></i> Пациенты
                    </a>
                </li>
                <li>
                    <a href="clinics" class="active">
                        <i class="fas fa-hospital"></i> Клиники
                    </a>
                </li>
                <li>
                    <a href="reports">
                        <i class="fas fa-chart-bar"></i> Отчеты
                    </a>
                </li>
                <li>
                    <a href="profile">
                        <i class="fas fa-user-cog"></i> Настройки
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Page Header -->
            <div class="page-header">
                <h1><i class="fas fa-hospital"></i> Клиники</h1>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background-color: #eff6ff; color: var(--primary-color);">
                        <i class="fas fa-hospital"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="clinicsCount">0</div>
                        <div class="stat-label">Всего клиник</div>
                    </div>
                </div>
            </div>

            <!-- Clinics List -->
            <div class="clinics-list" id="clinicsList">
                <div class="loading-spinner">
                    <div><i class="fas fa-spinner fa-spin"></i></div>
                    <div>Загрузка клиник...</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        // РЕАЛЬНАЯ ИНТЕГРАЦИЯ С ВАШИМ БЭКЕНДОМ
        // ============================================================
        const API_BASE = '/api/v1';

        // DOM элементы для авторизации
        const userPanel = document.getElementById('userPanel');
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const logoutBtn = document.getElementById('logoutBtn');

        // Toast уведомления
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(40px)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Обновить UI в зависимости от авторизации
        function updateUI(user) {
            if (user) {
                userPanel.style.display = 'flex';
                const fullName = user.full_name || user.email || 'Пользователь';
                
                const nameParts = fullName.trim().split(' ');
                let firstName = '';
                let lastName = '';
                
                if (nameParts.length >= 2) {
                    lastName = nameParts[0];
                    firstName = nameParts.slice(1).join(' ');
                } else {
                    firstName = fullName;
                }
                
                userName.innerHTML = `${lastName}<br><span style="font-weight: 400; font-size: 0.9rem; color: var(--gray-color);">${firstName}</span>`;
                userAvatar.textContent = (lastName || firstName).charAt(0).toUpperCase();
            } else {
                userPanel.style.display = 'none';
                window.location.href = '/';
            }
        }

        // Проверить текущего пользователя
        async function checkAuth() {
            try {
                const response = await fetch(`${API_BASE}/auth/me`, {
                    credentials: 'include'
                });
                if (response.ok) {
                    const user = await response.json();
                    updateUI(user);
                    return user;
                }
                updateUI(null);
                return null;
            } catch (err) {
                updateUI(null);
                return null;
            }
        }

        // Выход
        logoutBtn.addEventListener('click', async () => {
            try {
                const response = await fetch(`${API_BASE}/auth/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
                if (response.ok) {
                    showToast('✅ Выход выполнен', 'success');
                    updateUI(null);
                    window.location.href = '/';
                }
            } catch (err) {
                showToast('⚠️ Ошибка при выходе', 'error');
            }
        });

        // Проверяем авторизацию при загрузке
        checkAuth();

        // ============================================================
        // ОСНОВНАЯ ЛОГИКА СТРАНИЦЫ
        // ============================================================

        // Загрузка клиников с сервера
        async function loadClinics() {
            const container = document.getElementById('clinicsList');
            
            try {
                const response = await fetch(`${API_BASE}/clinics`, {
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    throw new Error('Ошибка загрузки клиников');
                }
                
                const clinics = await response.json();
                renderClinics(clinics);
                
            } catch (error) {
                console.error('Ошибка:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color: var(--danger-color);"></i>
                        <h3>Ошибка загрузки</h3>
                        <p>Не удалось загрузить список клиников. Попробуйте позже.</p>
                        <button class="btn btn-primary" onclick="loadClinics()">
                            <i class="fas fa-redo"></i> Повторить
                        </button>
                    </div>
                `;
            }
        }

        // Рендер клиников
        function renderClinics(clinics) {
            const container = document.getElementById('clinicsList');
            
            // Обновляем счетчик
            document.getElementById('clinicsCount').textContent = clinics.length;
            
            if (clinics.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-hospital"></i>
                        <h3>Клиники не найдены</h3>
                        <p>В базе данных пока нет клиник.</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            
            clinics.forEach(clinic => {
                const item = document.createElement('div');
                item.className = 'clinic-item';
                item.innerHTML = `
                    <div class="clinic-info">
                        <div class="clinic-name">${clinic.name}</div>
                        <div class="clinic-address">
                            <i class="fas fa-map-marker-alt"></i> ${clinic.address}
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            loadClinics();
        });
    </script>
</body>
</html>
