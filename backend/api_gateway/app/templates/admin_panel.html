<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medpoint · Панель управления</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23144753'/%3E%3Cpath d='M32 15v34M15 32h34' stroke='%23fff' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/static/admin_panel.css">
</head>
<body>
<div class="app">
  <aside class="side" id="sidebar">
    <div><nav class="nav" id="nav"></nav></div>
    <div class="sidefoot">
      <strong id="userLabel">Загрузка…</strong>
      <span id="userSub"></span>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <button class="mobilemenu" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Открыть меню">☰</button>
      <a href="#" class="top-brand" onclick="event.preventDefault();navigate('overview')" title="На главную"><span class="mark">+</span> Medpoint</a>
      <div class="topright">
        <span class="top-user" id="topUserName">—</span>
        <div class="avatar" id="topAvatar">—</div>
        <button class="btn small" id="logoutBtn" type="button">Выйти</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="backdrop" id="backdrop">
  <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <header>
      <h2 id="drawerTitle"></h2>
      <button id="close" aria-label="Закрыть">×</button>
    </header>
    <div id="drawerBody"></div>
  </div>
</div>

<div class="backdrop" id="historyModal">
  <div class="drawer" style="width:min(720px,100%)">
    <header>
      <h2>История изменений</h2>
      <button onclick="document.getElementById('historyModal').classList.remove('open')">×</button>
    </header>
    <div id="historyModalBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/static/admin_panel.js"></script>
</body>
</html>
