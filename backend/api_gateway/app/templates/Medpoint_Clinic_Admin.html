function reportRows(f){return visibleRequests().filter(r=>r.dateIso&&r.dateIso>=f.from&&r.dateIso<=f.to&&(f.agent==='all'||String(r.doctorId)===String(f.agent))&&(f.specialty==='all'||(f.specialty==='missing'?!r.specializationId:r.specializationId===f.specialty)))}
function payrollSummary(f){const candidates=reportRows(f).filter(r=>r.status==='approved'&&r.payoutStatus!=='paid');const missing=candidates.filter(r=>requestReward(r)===null),map=new Map();for(const r of candidates){const reward=requestReward(r);if(reward===null||reward===0)continue;const current=map.get(r.doctorId)||{agentId:r.doctorId,cents:0};current.cents+=Math.round(reward*100);map.set(r.doctorId,current)}return {rows:[...map.values()].map(x=>({agentId:x.agentId,amount:x.cents/100})),missing,candidates}}
function reports(){return heading('Отчёты','Выплаты агентам')+`<section class="panel"><div class="panelhead"><div><h2>Параметры</h2></div><div class="preset-buttons"><button class="btn small" data-action="reportPreset" data-preset="month">Этот месяц</button><button class="btn small" data-action="reportPreset" data-preset="previous">Прошлый месяц</button><button class="btn small" data-action="reportPreset" data-preset="all">Весь период</button></div></div><div class="report-fields"><div class="field"><label>Начало</label><input type="date" data-report-field="from" value="${esc(reportFilters.from)}"></div><div class="field"><label>Конец</label><input type="date" data-report-field="to" value="${esc(reportFilters.to)}"></div><div class="field"><label>Специализация</label><select data-report-field="specialty"><option value="all">Все</option>${options(availableFilterSpecialties(),reportFilters.specialty)}<option value="missing" ${reportFilters.specialty==='missing'?'selected':''}>Не указана</option></select></div><div class="field"><label>Агент</label><select data-report-field="agent"><option value="all">Все</option>${options(visibleAgents(),reportFilters.agent)}</select></div></div></section><div id="reportResults">${reportResults()}</div>`}
function reportResults(){try{const rows=reportRows(reportFilters),pay=payrollSummary(reportFilters),approved=rows.filter(r=>r.status==='approved'),sum=pay.rows.reduce((a,x)=>a+Math.round(x.amount*100),0)/100;return `<div class="grid">${[{label:'Заявок',value:rows.length,detail:'По фильтрам'},{label:'Подтверждено',value:approved.length,detail:'Для выплаты'},{label:'Выручка',value:money(approved.reduce((a,x)=>a+x.amount,0)),detail:'По подтверждённым'},{label:'К выплате',value:money(sum),detail:pay.rows.length+' агентов'}].map(i=>`<div class="stat"><span class="stat-lbl">${i.label}</span><strong>${i.value}</strong><em>${i.detail}</em></div>`).join('')}</div><section class="panel"><div class="panelhead"><h2>Ведомость</h2><p>${reportFilters.from} — ${reportFilters.to}</p></div>${payrollTable(pay.rows)}</section>`}catch(error){return `<section class="panel"><div class="empty">${esc(error.message)}</div></section>`}}
function payrollTable(rows){return table(['Код','ФИО','Период','К выплате'],rows.map(x=>`<tr><td>AG-${x.agentId}</td><td>${esc(agentById(x.agentId)?.name||'—')}</td><td>${reportFilters.from} — ${reportFilters.to}</td><td><strong>${money(x.amount)}</strong></td></tr>`))}
function refreshReports(){if(page==='reports')$('#reportResults').innerHTML=reportResults()}
function setReportPreset(preset){const [year,month]=localToday.split('-').map(Number),iso=d=>d.toISOString().slice(0,10);if(preset==='all'){const dates=visibleRequests().map(r=>r.dateIso).filter(Boolean).sort();reportFilters.from=dates[0]||localToday;reportFilters.to=dates.at(-1)||localToday}else if(preset==='month'){reportFilters.from=iso(new Date(Date.UTC(year,month-1,1)));reportFilters.to=iso(new Date(Date.UTC(year,month,0)))}else if(preset==='previous'){reportFilters.from=iso(new Date(Date.UTC(year,month-2,1)));reportFilters.to=iso(new Date(Date.UTC(year,month-1,0)))}render()}
</script><script>

function navigate(target,options={}){const params=new URLSearchParams();params.set('page',target);if(options.agent)params.set('agent',options.agent);if(options.clinic)params.set('clinic',options.clinic);if(options.filter)params.set('filter',options.filter);const hash='#'+params.toString();if(location.hash===hash)readRoute();else location.hash=hash}
function readRoute(){const p=new URLSearchParams(location.hash.slice(1));page=p.get('page')||'overview';if(page==='doctors')page='agents';if(page==='registrations')page='agents';if(!Object.hasOwn(names,page))page='overview';if(!canViewPage(page))page='overview';filter=p.get('filter')||'all';payoutFilter='all';profileId=page==='agents'?Number(p.get('agent'))||null:null;clinicSettingsId=page==='clinics'?Number(p.get('clinic'))||null:null;clinicSpecialtyQuery='';clinicSpecialtyStatus='all';clinicSettingsTab='rates';query='';specialtyFilter='all';profileQuery='';profileTab='rates';profileHistoryFilter='all';close();render();window.scrollTo(0,0)}

const heading=(title,desc,action='')=>`<div class="heading"><div><h1>${esc(title)}</h1>${desc?`<p class="muted">${esc(desc)}</p>`:''}</div>${action}</div>`;
function stats(items){return `<div class="grid">${items.map(i=>`<${i.page?'button':'div'} class="stat ${i.page?'stat-action':''}" ${i.page?`data-page="${i.page}"`:''}><span class="stat-lbl">${i.label}</span><strong>${i.value}</strong><em>${i.detail||''}</em></${i.page?'button':'div'}>`).join('')}</div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">По заданным условиям ничего не найдено</td></tr>`}</tbody></table></div>`}

function rewardCell(reward,rate){return reward===null?'<span class="unset">Не рассчитано</span>':`<strong>${money(reward)}</strong><small>${percent(rate)}</small>`}
function searchControls(label,withSpecialty=false){return `<div class="controls"><input class="search" id="search" placeholder="${label}" value="${esc(query)}">${withSpecialty?`<select class="filter" id="specialtyFilter"><option value="all">Все специализации</option>${options(availableFilterSpecialties(),specialtyFilter)}<option value="missing" ${specialtyFilter==='missing'?'selected':''}>Не указана</option></select>`:''}${page==='requests'?`<select class="filter" id="filter"><option value="all">Все статусы</option>${options(Object.entries(REQUEST_STATUSES).map(([id,name])=>({id,name})),filter)}</select><select class="filter" id="payoutFilter"><option value="all">Все выплаты</option>${options(Object.entries(PAYOUT_STATUSES).map(([id,name])=>({id,name})),payoutFilter)}</select>`:''}</div>`}
function overview(){
  const r=visibleRequests(),confirmed=r.filter(x=>x.status==='approved'),agents=visibleAgents();
  const items=[
    {label:'Заявки',double:[{label:'Новых',value:r.filter(x=>x.status==='new').length},{label:'Подтверждено',value:confirmed.length}],detail:'Перейти к заявкам',page:'requests'},

    {label:'Финансы',double:[{label:'Выручка',value:money(confirmed.reduce((a,x)=>a+x.amount,0))},{label:'К выплате',value:money(confirmed.filter(x=>x.payoutStatus!=='paid').reduce((a,x)=>a+(requestReward(x)||0),0))}],detail:'Открыть отчёты',page:'reports'}

    +`<div class="split">

      </div>`;
}
function filteredRequests(){return visibleRequests().filter(x=>(filter==='all'||x.status===filter)&&(payoutFilter==='all'||x.payoutStatus===payoutFilter)&&(specialtyFilter==='all'||(specialtyFilter==='missing'?!x.specializationId:x.specializationId===specialtyFilter))&&[x.id,x.patient,x.service,agentById(x.doctorId)?.name,requestSpecialtyName(x)].join(' ').toLowerCase().includes(query.toLowerCase()))}
function requestTable(){return table(['Заявка','Пациент / услуга','Агент','Специализация','Стоимость','Вознаграждение','Статус','Выплата',''],filteredRequests().map(x=>`<tr><td><strong>№ ${x.id}</strong><small>${esc(x.date)}</small></td><td class="wrap"><strong>${esc(x.patient)}</strong><small>${esc(x.service)}</small></td><td>${esc(agentById(x.doctorId)?.name||'—')}</td><td class="wrap">${esc(requestSpecialtyName(x))}</td><td>${money(x.amount)}</td><td>${rewardCell(requestReward(x),requestRate(x))}</td><td>${pill(REQUEST_STATUSES[x.status],x.status)}</td><td>${pill(PAYOUT_STATUSES[x.payoutStatus],x.payoutStatus==='paid'?'approved':x.payoutStatus==='processing'?'work':'')}</td><td><button class="btn small" data-action="request" data-id="${x.id}">Изменить</button></td></tr>`))}

function agentTable(){return table(['Агент','Клиники','Доступ',''],filteredAgents().map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td class="wrap">${(x.clinicIds||[]).map(id=>esc(clinicById(id)?.name||'')).filter(Boolean).join(', ')||'—'}</td><td>${pill(x.active?'Активен':'Отключён',x.active?'approved':'rejected')}</td><td><button class="btn small" data-page="agents" data-agent="${x.id}">Профиль</button></td></tr>`))}
function agents(){if(profileId)return profile();const pending=visibleRegistrations().filter(r=>r.status==='pending');const regBlock=canReviewRegistrations()?`<section class="panel section-anchor" id="registrationsBlock"><div class="panelhead"><div><h2>Регистрация агентов</h2><p>На рассмотрении: ${pending.length}</p></div><div class="controls"><input id="searchReg" class="search" placeholder="Имя или почта" value="${esc(query)}"><select id="registrationFilter" class="filter"><option value="all">Все статусы</option>${options(Object.entries(REGISTRATION_STATUSES).map(([id,name])=>({id,name})),registrationFilter)}</select></div></div><div id="regResults">${registrationTable()}</div></section>`:'';return heading('Агенты','',`<div style="display:flex;gap:10px;align-items:center">${pending.length?`<button class="btn" onclick="scrollToRegistrations()">Новые ↓ ${pending.length}</button>`:''}<button class="btn primary" data-action="newAgent">Добавить агента</button></div>`)+`<section class="panel"><div class="panelhead">${searchControls('Поиск агента')}</div><div id="tableResults">${agentTable()}</div></section>`+regBlock}

function profile(){const x=visibleAgents().find(a=>a.id===profileId);if(!x)return heading('Агент не найден','','<button class="btn small" data-page="agents">Назад</button>');const clinicNames=(x.clinicIds||[]).map(id=>clinicById(id)?.name).filter(Boolean).join(', ')||'—';return `<button class="btn small back-link" data-page="agents">← Назад</button>`+heading(x.name,'',`<button class="btn" data-action="editAgent" data-id="${x.id}">Редактировать профиль</button>`)+`<section class="panel profile-summary"><div><span class="meta-label">Телефон</span><strong>${esc(x.phone||'—')}</strong></div><div><span class="meta-label">Почта</span><strong>${esc(x.email||'—')}</strong></div><div><span class="meta-label">Клиники</span><strong>${esc(clinicNames)}</strong></div><div><span class="meta-label">Ответственный администратор</span><strong>${esc(adminById(x.adminId)?.name||'Не назначен')}</strong></div><div><span class="meta-label">Доступ</span>${pill(x.active?'Активен':'Отключён',x.active?'approved':'rejected')}</div></section><div class="tabbar"><button class="${profileTab==='rates'?'selected':''}" data-tab="rates">Вознаграждение <span>${clinicSpecialties((x.clinicIds||[])[0],true).length}</span></button><button class="${profileTab==='history'?'selected':''}" data-tab="history">История агента <span>${agentRateHistoryEvents(x.id).length}</span></button></div><section class="panel">${profileContents(x)}</section>`}

function rateTable(x){const allSpecialties=new Map();for(const cid of x.clinicIds||[])for(const s of clinicSpecialties(cid,true))allSpecialties.set(s.id,s);const rows=[...allSpecialties.values()].filter(s=>(s.name+' '+(s.detail||'')).toLowerCase().includes(profileQuery.toLowerCase()));return table(['Специализация','Клиники','Применяется',''],rows.map(s=>{const mode=agentRateMode(x.id,s.id),custom=agentCustomRate(x.id,s.id);const ratesByClinic=(x.clinicIds||[]).map(cid=>{const cs=clinicSpecialty(cid,s.id);return {cid,clinic:clinicById(cid),rate:mode==='custom'?custom:(cs?.active?cs.defaultRate:null)}});const uniqueRates=[...new Set(ratesByClinic.map(r=>r.rate).filter(r=>r!==null))];const applies=mode==='custom'?`${percent(custom)} (личная)`:uniqueRates.length===1?`${percent(uniqueRates[0])} (по клиникам)`:'По клиникам';return `<tr><td class="specialty-cell"><strong>${esc(s.name)}</strong>${s.detail?`<small>${esc(s.detail)}</small>`:''}</td><td><button class="btn small" data-action="agentClinicsRates" data-id="${x.id}" data-specialty="${s.id}">Посмотреть</button></td><td><strong>${applies}</strong></td><td><button class="btn small" data-action="rateMode" data-id="${x.id}" data-specialty="${s.id}">Изменить</button></td></tr>`}))}
function agentRateHistoryEvents(agentId){return data.rateHistory.filter(h=>h.agentId===agentId).slice().sort((a,b)=>b.date.localeCompare(a.date))}

function rateHistory(agentId){const history=agentRateHistoryEvents(agentId).filter(h=>profileHistoryFilter==='all'||h.specialty===profileHistoryFilter);if(!history.length)return '<div class="empty">Изменений пока нет.</div>';const labels={set_custom:'Установлена личная ставка',set_clinic:'Возврат к ставке клиники',approval:'Согласование',inherit:'Возврат к ставке клиники',profile_update:'Профиль'};return table(['Дата / автор','Специализация','Изменение','Прежний процент','Новый процент','Комментарий'],history.map(h=>`<tr><td><strong>${dateTime(h.date)}</strong><small>${esc(h.actor)}</small></td><td class="wrap">${esc(h.specialtyName||'')}</td><td class="wrap">${pill(labels[h.action]||h.action,h.action==='set_custom'?'approved':'')}</td><td>${percent(h.old)}</td><td>${percent(h.new)}</td><td class="wrap">${esc(h.comment||'—')}</td></tr>`))}
function render(){if(!canViewPage(page))page='overview';nav();$('#content').innerHTML=({overview,requests,reports,agents,clinics})[page]()}

function toast(msg){const t=$('#toast');t.textContent=msg+(storageProblem?' Изменения доступны до закрытия страницы.':'');t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),4500)}
const formActions=label=>`<div class="actions"><button class="btn primary" type="submit">${label}</button><button class="btn" type="button" data-action="close">Отмена</button></div>`;
function requestForm(id){const x=visibleRequests().find(y=>y.id===id);if(!x)return;const history=data.requestHistory.filter(h=>h.requestId===id);const payoutHistory=data.payoutHistory.filter(h=>h.requestId===id);open('Заявка № '+id,`<p class="muted">${esc(x.date)} · ${esc(agentById(x.doctorId)?.name||'')}</p><dl class="details"><div><dt>Пациент</dt><dd>${esc(x.patient)}</dd></div><div><dt>Услуга</dt><dd>${esc(x.service)}</dd></div><div><dt>Стоимость</dt><dd>${money(x.amount)}</dd></div><div><dt>Вознаграждение</dt><dd>${requestReward(x)===null?'Не рассчитано':money(requestReward(x))+' · '+percent(requestRate(x))}</dd></div></dl><form id="requestForm" data-id="${id}"><div class="field"><label>Статус заявки</label><select name="status">${options(Object.entries(REQUEST_STATUSES).map(([id,name])=>({id,name})),x.status)}</select></div><div class="field"><label>Статус выплаты</label><select name="payoutStatus">${options(Object.entries(PAYOUT_STATUSES).map(([id,name])=>({id,name})),x.payoutStatus)}</select></div>${formActions('Сохранить')}</form>${history.length?`<h3>История статусов</h3>${history.map(h=>`<div class="history-item"><strong>${esc(REQUEST_STATUSES[h.old]||'Новая')} → ${esc(REQUEST_STATUSES[h.new]||'Новая')}</strong><small>${dateTime(h.date)} · ${esc(h.actor)}</small></div>`).join('')}`:''}${payoutHistory.length?`<h3>История выплат</h3>${payoutHistory.map(h=>`<div class="history-item"><strong>${esc(PAYOUT_STATUSES[h.old]||'—')} → ${esc(PAYOUT_STATUSES[h.new]||'—')}</strong><small>${dateTime(h.date)} · ${esc(h.actor)}</small></div>`).join('')}`:''}`)}
function rateModeForm(agentId,specialty){
  const a=agentById(agentId);if(!a)throw Error('Агент не найден.');
  const mode=agentRateMode(agentId,specialty),custom=agentCustomRate(agentId,specialty);
  const spName=specialtyName(specialty);
  const clinicsList=(a.clinicIds||[]).map(cid=>{const cs=clinicSpecialty(cid,specialty);return `<div><dt>${esc(clinicById(cid)?.name||'')}</dt><dd>${cs?.active?percent(cs.defaultRate):'Не задана'}</dd></div>`}).join('');
  const customOpen=mode==='custom';
  open('Вознаграждение: '+spName,
    `<dl class="details">${clinicsList||'<div><dt>Клиники</dt><dd>Не выбраны</dd></div>'}</dl>
     <form id="rateModeForm" data-id="${agentId}" data-specialty="${specialty}">
       <input type="hidden" name="mode" value="${mode}">
       <button type="button" class="rate-choice ${mode==='clinic'?'active':''}" data-mode-choice="clinic" style="width:100%;margin:8px 0;padding:16px;border:2px solid ${mode==='clinic'?'#146a70':'#d8e5e5'};border-radius:12px;background:${mode==='clinic'?'#eff7f6':'white'};text-align:left;cursor:pointer;font:inherit">
         <strong style="display:block;color:#146a70;font-size:15px">По клиникам</strong>
         <small style="display:block;color:#71888c;margin-top:4px">Процент берётся из клиники, куда направлен пациент</small>
       </button>
       <div class="rate-choice ${mode==='custom'?'active':''}" data-mode-choice="custom" style="width:100%;margin:8px 0;padding:16px;border:2px solid ${mode==='custom'?'#146a70':'#d8e5e5'};border-radius:12px;background:${mode==='custom'?'#eff7f6':'white'};cursor:pointer;font:inherit">
         <strong style="display:block;color:#146a70;font-size:15px">Личная ставка (для всех клиник)</strong>
         <small style="display:block;color:#71888c;margin-top:4px">Один процент на все клиники агента</small>
         <div class="field" id="customRateField" style="margin:12px 0 0;${customOpen?'':'display:none'}">
           <label>Процент</label>
           <input type="number" name="customRate" min="0" max="100" step="0.01" value="${custom??''}" onclick="event.stopPropagation()">
         </div>
       </div>
       <div class="actions">
         <button class="btn primary" type="submit">Сохранить</button>
         <button class="btn" type="button" data-action="close">Отмена</button>
       </div>
     </form>`
  );
}
function showAgentClinicsRates(agentId,specialty){
  const a=agentById(agentId);if(!a)return;
  const mode=agentRateMode(agentId,specialty),custom=agentCustomRate(agentId,specialty);
  const spName=specialtyName(specialty);
  const rows=(a.clinicIds||[]).map(cid=>{
    const cs=clinicSpecialty(cid,specialty);
    const rate=cs?.active?cs.defaultRate:null;
    return `<tr><td><strong>${esc(clinicById(cid)?.name||'')}</strong></td><td>${rate===null?'—':percent(rate)}</td><td>${cs?.active?pill('Действует','approved'):pill('Отключена','rejected')}</td></tr>`;
  }).join('');
  const customRow=mode==='custom'?`<tr style="background:#eff7f6"><td><strong>Личная ставка</strong> <small style="color:#146a70">(выбрано)</small></td><td><strong>${percent(custom)}</strong></td><td>${pill('Применяется','approved')}</td></tr>`:'';
  open('Проценты по клиникам',
    `<p class="muted">${esc(a.name)} · ${esc(spName)}</p>
     ${table(['Клиника','Процент','Статус'],[rows,customRow].filter(Boolean).join('')?[rows+customRow]:['<tr><td colspan="3" class="empty">Нет клиник</td></tr>'])}
     <div class="actions"><button class="btn" type="button" data-action="close">Закрыть</button></div>`
  );
}
function editAgentFormClinic(id){const x=agentById(id);if(!x)throw Error('Агент не найден.');open('Редактировать профиль агента',`<form id="agentProfileForm" data-id="${id}"><div class="field"><label>ФИО</label><input name="name" required value="${esc(x.name||'')}"></div><div class="field"><label>Телефон</label><input name="phone" type="tel" value="${esc(x.phone||'')}"></div><div class="field"><label>Доступ</label><select name="active">${options([{id:'true',name:'Активен'},{id:'false',name:'Отключён'}],String(x.active!==false))}</select></div><p class="note">Клиники и ответственного администратора изменяет администратор портала.</p>${formActions('Сохранить')}</form>`)}
function succeed(msg){close();render();toast(msg)}
function setupMultiSelect(wrapId,dropdownId){const wrap=document.getElementById(wrapId);if(!wrap)return;const dropdown=document.getElementById(dropdownId);const selected=new Set();wrap.querySelectorAll('.multi-select-tag').forEach(t=>{if(t.dataset.id)selected.add(Number(t.dataset.id))});wrap.addEventListener('click',e=>{if(e.target.closest('.multi-select-tag')){if(e.target.dataset.removeClinic){selected.delete(Number(e.target.dataset.removeClinic));e.stopPropagation();renderTags()}}else{dropdown.classList.toggle('show')}});wrap.addEventListener('mouseenter',()=>dropdown.classList.add('show'));wrap.addEventListener('mouseleave',()=>dropdown.classList.remove('show'));dropdown.querySelectorAll('.multi-select-option').forEach(opt=>{opt.addEventListener('click',e=>{e.stopPropagation();const cid=Number(opt.dataset.addClinic);if(selected.has(cid))selected.delete(cid);else selected.add(cid);renderTags();dropdown.classList.add('show')})});function renderTags(){wrap.querySelectorAll('.multi-select-tag').forEach(t=>t.remove());wrap.querySelector('span.muted')?.remove();const arr=[...selected];wrap.insertAdjacentHTML('afterbegin',arr.map(cid=>`<span class="multi-select-tag" data-id="${cid}">${esc(clinicById(cid)?.name||'')}<span class="x" data-remove-clinic="${cid}">×</span></span>`).join(''));if(!arr.length)wrap.insertAdjacentHTML('afterbegin','<span class="muted" style="font-size:13px;padding:4px 0;">Выберите клиники...</span>');dropdown.querySelectorAll('.multi-select-option').forEach(o=>{o.classList.toggle('selected',selected.has(Number(o.dataset.addClinic)))})}wrap.clinicSelected=()=>[...selected]}
function onClick(e){
  const p=e.target.closest('[data-page]');if(p){navigate(p.dataset.page,{agent:p.dataset.agent,clinic:p.dataset.clinic,filter:p.dataset.filter});return}
  const clinicTab=e.target.closest('[data-clinic-tab]');if(clinicTab){clinicSettingsTab=clinicTab.dataset.clinicTab;render();return}
  const t=e.target.closest('[data-tab]');if(t){profileTab=t.dataset.tab;render();return}
  const a=e.target.closest('[data-action]');if(!a)return;const id=Number(a.dataset.id);
  try{switch(a.dataset.action){
    case'requestFromOverview':navigate('requests');setTimeout(()=>requestForm(id),50);break;
    case'request':requestForm(id);break;
    case'rateMode':rateModeForm(id,a.dataset.specialty);break;
    case'agentClinicsRates':showAgentClinicsRates(id,a.dataset.specialty);break;
    case'close':close();break;
    case'registration':registrationForm(id);break;
    case'newClinicSpecialty':clinicSpecialtyForm(id);break;
    case'editClinicSpecialty':clinicSpecialtyForm(id,a.dataset.specialty);break;
    case'reportPreset':setReportPreset(a.dataset.preset);break;
    case'editAgent':editAgentFormClinic(id);break;
  }}
  catch(error){toast(error.message)}
}
function onRateChoice(e){
  if(e.target.closest('#customRateField'))return;
  const b=e.target.closest('[data-mode-choice]');if(!b)return;
  const form=b.closest('form');if(!form)return;
  const mode=b.dataset.modeChoice;
  form.querySelector('input[name="mode"]').value=mode;
  form.querySelectorAll('.rate-choice').forEach(el=>{
    const active=el.dataset.modeChoice===mode;
    el.classList.toggle('active',active);
    el.style.borderColor=active?'#146a70':'#d8e5e5';
    el.style.background=active?'#eff7f6':'white';
  });
  const f=form.querySelector('#customRateField');
  if(f)f.style.display=mode==='custom'?'':'none';
}
function onChange(e){const el=e.target;
  try{
    if(el.id==='clinicSpecialtyStatus'){clinicSpecialtyStatus=el.value;$('#clinicSpecialtyResults').innerHTML=clinicSpecialtyTable(clinicSettingsId);return}
    if(el.id==='registrationFilter'){registrationFilter=el.value;if($('#regResults'))$('#regResults').innerHTML=registrationTable();return}
    if(el.id==='filter'){filter=el.value;refreshTable();return}
    if(el.id==='payoutFilter'){payoutFilter=el.value;refreshTable();return}
    if(el.id==='specialtyFilter'){specialtyFilter=el.value;refreshTable();return}
    if(el.id==='clinicSpecialtySource'){const sel=SPECIALTIES.find(s=>s[0]===el.value);const nameEl=document.querySelector('[name="name"]');const detailEl=document.querySelector('[name="detail"]');if(sel){if(nameEl)nameEl.value=sel[1];if(detailEl)detailEl.value=sel[2]||''}return}
  }catch(error){toast(error.message);render()}
}
function onInput(e){if(e.target.id==='clinicSpecialtySearch'){clinicSpecialtyQuery=e.target.value;$('#clinicSpecialtyResults').innerHTML=clinicSpecialtyTable(clinicSettingsId)}if(e.target.id==='search'){query=e.target.value;refreshTable()}if(e.target.id==='searchReg'){query=e.target.value;if($('#regResults'))$('#regResults').innerHTML=registrationTable()}if(e.target.id==='profileSearch'){profileQuery=e.target.value;$('#rateResults').innerHTML=rateTable(agentById(profileId))}}
function onSubmit(e){e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f)),id=Number(f.dataset.id);
  try{
    if(f.id==='requestForm'){const r=data.requests.find(x=>x.id===id);if(v.status!==r.status)setRequestStatus(id,v.status);if(v.payoutStatus!==r.payoutStatus)setPayout(id,v.payoutStatus,'','');succeed('Заявка обновлена')}
    if(f.id==='rateModeForm'){setAgentRateMode(id,f.dataset.specialty,v.mode,v.customRate);succeed('Вознаграждение обновлено')}
    if(f.id==='clinicSpecialtyForm'){saveClinicSpecialty(id,f.dataset.specialty||null,v);succeed('Специализация сохранена')}
    if(f.id==='registrationDecisionForm'){decideRegistration(id,v.decision,null,v.reason);succeed('Решение сохранено')}
    if(f.id==='agentProfileForm'){updateAgentProfileClinic(id,v);succeed('Профиль агента обновлён')}
  }catch(error){toast(error.message)}
}
document.addEventListener('click',onRateChoice);
document.addEventListener('click',onClick);
document.addEventListener('change',onChange);document.addEventListener('input',onInput);document.addEventListener('submit',onSubmit);
$('#close').onclick=close;
$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();$('#sidebar').classList.remove('open')}});
window.addEventListener('hashchange',readRoute);readRoute();
</script></body></html>
