name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-service-users:
    name: Test service_users
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/service_users
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/service_users/reqs.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r reqs.txt

      - name: Run tests
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          JWT_ALGORITHM: HS256
          ACC_TOKEN_EXP_MIN: "60"
          DATABASE_URL: sqlite+aiosqlite:///:memory
        run: pytest -v --tb=short