name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-service-users:
    name: Test service_users
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/service_users
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/service_users/reqs.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r reqs.txt
      - name: Run tests
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          JWT_ALGORITHM: HS256
          ACC_TOKEN_EXP_MIN: "60"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: pytest -q

  test-api-gateway:
    name: Test api_gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/api_gateway/reqs.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r reqs.txt
      - name: Run tests
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          JWT_ALGORITHM: HS256
          REDIS_URL: "redis://localhost:6379/15"
        run: pytest -q